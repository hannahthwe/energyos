<style>
/* Layout: control-room console — fixed nav rail, dense instrument panels, severity encoded as stripes and pills. */
:root {
  --bg: #0d1316; --surface: #141c20; --raised: #1a252a; --line: #26343b; --fg: #dde6e9; --muted: #8b9ca4;
  --accent: #46b4d8; --accent-ink: #062330; --amber: #e8a33d;
  --crit: #f0546a; --high: #f08a4b; --med: #e6c34a; --low: #6fb6e8; --info: #7e8f97; --ok: #4cc38a;
  --s1: #46b4d8; --s2: #e8a33d; --s3: #4cc38a; --s4: #b28cf0; --s5: #8b9ca4;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f2f5f6; --surface: #ffffff; --raised: #f7fafb; --line: #d7e0e4; --fg: #13222a; --muted: #5a6d76;
  --accent: #0f7fa8; --accent-ink: #ffffff; --amber: #b5711a;
  --crit: #c72742; --high: #c4581c; --med: #9a7a08; --low: #2a7bb8; --info: #6b7b83; --ok: #1d8a57;
  --s1: #0f7fa8; --s2: #b5711a; --s3: #1d8a57; --s4: #7a52c7; --s5: #6b7b83; color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #f2f5f6; --surface: #ffffff; --raised: #f7fafb; --line: #d7e0e4; --fg: #13222a; --muted: #5a6d76;
  --accent: #0f7fa8; --accent-ink: #ffffff; --amber: #b5711a;
  --crit: #c72742; --high: #c4581c; --med: #9a7a08; --low: #2a7bb8; --info: #6b7b83; --ok: #1d8a57;
  --s1: #0f7fa8; --s2: #b5711a; --s3: #1d8a57; --s4: #7a52c7; --s5: #6b7b83; color-scheme: light; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-size: 12.5px; }
.muted { color: var(--muted); }
.app { display: grid; grid-template-columns: 220px 1fr; min-height: 100%; }
.rail { background: var(--surface); border-right: 1px solid var(--line); padding-block: 18px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: 14px;
  position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; display: flex; flex-direction: column; gap: 18px; }
.brand { font-family: var(--font-display); font-weight: 600; font-size: 17px; letter-spacing: .01em; display: flex; align-items: center; gap: 9px; }
.brand svg { flex: none; }
.brand small { display: block; font: 500 10.5px var(--font-mono); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; justify-content: space-between; align-items: center; padding: 7px 10px; border-radius: 6px; color: var(--muted); text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--raised); color: var(--fg); }
.nav a.on { background: var(--raised); color: var(--fg); box-shadow: inset 2px 0 0 var(--accent); }
.nav .count { font: 500 11px var(--font-mono); background: var(--crit); color: #fff; border-radius: 9px; padding: 0 6px; }
.rail-foot { margin-top: auto; font-size: 12px; color: var(--muted); display: grid; gap: 6px; }
main { min-width: 0; padding-block: 18px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.topbar h1 { font: 600 24px/1.2 var(--font-display); margin: 0; text-wrap: balance; }
.who { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--muted); background: var(--surface); white-space: nowrap; }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
select, input[type=text], input[type=number], textarea { background: var(--raised); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; min-width: 0; }
textarea { width: 100%; resize: vertical; }
.btn { background: var(--raised); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { border-color: var(--crit); color: var(--crit); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.grid { display: grid; gap: 14px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.kpi b { display: block; font: 600 26px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.kpi span { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.kpi.alert b { color: var(--crit); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; min-width: 0; }
.panel h2 { font: 600 15px var(--font-display); letter-spacing: .02em; margin: 0 0 10px; display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.panel h3 { font: 600 13px var(--font-display); margin: 14px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; }
.cols-2-1 { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--raised); }
.sev { display: inline-block; font: 500 11px var(--font-mono); text-transform: uppercase; padding: 1px 7px; border-radius: 4px; border: 1px solid currentColor; white-space: nowrap; }
.sev-critical { color: var(--crit); } .sev-high { color: var(--high); } .sev-medium { color: var(--med); } .sev-low { color: var(--low); } .sev-info { color: var(--info); }
.stripe { border-left: 3px solid var(--info); } .stripe-critical { border-left-color: var(--crit); } .stripe-high { border-left-color: var(--high); } .stripe-medium { border-left-color: var(--med); } .stripe-low { border-left-color: var(--low); }
.tag { display: inline-block; font-size: 11.5px; padding: 0 7px; border-radius: 4px; background: var(--raised); border: 1px solid var(--line); margin: 1px 3px 1px 0; white-space: nowrap; }
.tag.cyber { color: var(--s4); } .tag.physical { color: var(--s2); } .tag.context { color: var(--ok); } .tag.supply_chain { color: var(--s1); }
.hyp { display: grid; grid-template-columns: minmax(150px, 1.2fr) 2fr 44px; gap: 10px; align-items: center; padding: 5px 0; }
.bar { height: 8px; background: var(--raised); border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; background: var(--accent); }
.hyp.top .bar i { background: var(--amber); }
.hyp small { grid-column: 1 / -1; color: var(--muted); font-size: 12px; margin-top: -3px; }
.list { display: grid; gap: 8px; }
.item { background: var(--raised); border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px; min-width: 0; }
.item .meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.notice { border: 1px dashed var(--line); border-radius: 6px; padding: 9px 12px; color: var(--muted); font-size: 13px; }
.notice.warn { border-color: var(--amber); color: var(--fg); }
.devgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
.dev { background: var(--raised); border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px; font-size: 12.5px; }
.dev b { font-family: var(--font-display); font-size: 14px; }
.dev .big { font: 600 18px var(--font-display); font-variant-numeric: tabular-nums; }
.off { color: var(--crit); }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 10px var(--font-mono); }
.chart .grid line { stroke: var(--line); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 3px; vertical-align: middle; margin-right: 5px; border-radius: 2px; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 8px; }
.steps li::marker { font-family: var(--font-mono); color: var(--accent); }
.timeline { position: relative; display: grid; gap: 8px; }
.ev { display: grid; grid-template-columns: 22px 74px 1fr; gap: 8px; align-items: start; }
.ev input { margin-top: 3px; }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 9px 14px; border-radius: 6px; font-weight: 500; z-index: 20; max-width: calc(100% - 32px); }
.modal { position: fixed; inset: 0; background: rgb(0 0 0 / .5); display: grid; place-items: center; z-index: 30; padding: 16px; }
.modal .panel { width: min(900px, 100%); max-height: 85vh; overflow: auto; }
pre { white-space: pre-wrap; word-break: break-word; font: 12px var(--font-mono); background: var(--raised); border: 1px solid var(--line); border-radius: 6px; padding: 10px; max-height: 60vh; overflow: auto; }
.ok { color: var(--ok); } .bad { color: var(--crit); }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .rail { position: static; height: auto; flex-direction: column; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-right: 0; border-bottom: 1px solid var(--line); }
  .nav { flex-direction: row; flex-wrap: wrap; }
  .rail-foot { display: none; }
  .cols-2-1 { grid-template-columns: 1fr; }
  .cols { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: no-preference) { .bar i { transition: width .4s ease; } }

<script>
/* EnergyOS Secure — in-browser engine.
 * JavaScript port of the Python package in /energyos (simulator, detection, correlation,
 * supply chain, workflow, audit, API router). Used when the dashboard is opened as a static
 * page with no backend (e.g. the hosted pitch link). Same rules, thresholds and permissions. */
(function () {
  "use strict";

  // ---------------------------------------------------------------- deterministic RNG
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function makeRng(seed) {
    const r = mulberry32(seed);
    return {
      random: r,
      uniform: (a, b) => a + (b - a) * r(),
      gauss: (mu, sd) => mu + sd * Math.sqrt(-2 * Math.log(r() || 1e-12)) * Math.cos(2 * Math.PI * r()),
      choice: (arr) => arr[Math.floor(r() * arr.length)],
      id: () => Array.from({ length: 4 }, () => Math.floor(r() * 0xffffffff).toString(16).padStart(8, "0")).join("-"),
    };
  }
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const nowIso = () => new Date().toISOString().slice(0, 19) + "Z";

  // ---------------------------------------------------------------- fleet (fictitious)
  const VENDORS = {
    voltcharge: { name: "VoltCharge Systems", type: "EV charger OEM" },
    sunpeak: { name: "SunPeak Inverters", type: "Solar inverter OEM" },
    storacell: { name: "StoraCell Batteries", type: "Battery OEM" },
    homegrid: { name: "HomeGrid HEMS", type: "HEMS provider" },
    meterwise: { name: "MeterWise Metering", type: "Smart meter OEM" },
  };
  const MODELS = {
    charger: { vendor: "voltcharge", model: "VC-Bidi 11 (V2H)", rated: 11000 },
    inverter: { vendor: "sunpeak", model: "SP-5000", rated: 5000 },
    battery: { vendor: "storacell", model: "SC-10", rated: 5000 },
    gateway: { vendor: "homegrid", model: "HG-Hub 2", rated: 0 },
    meter: { vendor: "meterwise", model: "MW-1", rated: 0 },
  };
  const INSTALLATIONS = {
    "inst-001": { name: "Residence 001 (Leeds)", charger_fw: "3.2.1" },
    "inst-002": { name: "Residence 002 (York)", charger_fw: "3.2.1" },
    "inst-003": { name: "Residence 003 (Bristol)", charger_fw: "3.2.1" },
    "inst-004": { name: "Residence 004 (Cardiff)", charger_fw: "3.3.0" },
  };
  const OTHER_FW = { inverter: "1.9.2", battery: "4.0.3", gateway: "5.1.0", meter: "2.0.1" };
  const KNOWN_CLIENTS = new Set(["hems-optimiser", "homegrid-cloud", ...Object.keys(INSTALLATIONS).map((i) => "app-user-" + i.slice(-3))]);
  const EV_CAP = 60000, BAT_CAP = 10000, EFF = 0.93;

  // ---------------------------------------------------------------- supply chain fixtures (CycloneDX-derived)
  const FW_COMPONENTS = {
    "VC-Bidi 11 (V2H)|3.2.1": [["vc-ocpp-stack", "1.4.2", "ev_charging,v2h_discharge"], ["vc-v2h-controller", "2.1.0", "v2h_discharge"], ["openssl", "1.1.1k", "device_communications"], ["mosquitto", "2.0.11", "device_communications"], ["zlib", "1.2.11", ""]],
    "VC-Bidi 11 (V2H)|3.3.0": [["vc-ocpp-stack", "1.5.0", "ev_charging,v2h_discharge"], ["vc-v2h-controller", "2.2.0", "v2h_discharge"], ["openssl", "3.0.13", "device_communications"], ["mosquitto", "2.0.18", "device_communications"], ["zlib", "1.3.1", ""]],
    "HG-Hub 2|5.1.0": [["hg-auth-service", "3.0.4", "hems_command_integrity"], ["hg-device-broker", "5.1.0", "hems_command_integrity,device_communications"], ["openssl", "3.0.8", "device_communications"], ["nginx", "1.22.1", "device_communications"]],
    "SP-5000|1.9.2": [["sp-modbus-gw", "1.2.0", "solar_inverter_monitoring"], ["mbedtls", "2.28.0", "device_communications"]],
    "SC-10|4.0.3": [["sc-bms-core", "4.0.3", "battery_management"], ["mbedtls", "2.16.12", "device_communications"]],
    "MW-1|2.0.1": [["mw-dlms", "2.0.1", "metering"], ["mbedtls", "3.4.0", "device_communications"]],
  };
  const SUPPLIERS = { "VC-Bidi 11 (V2H)": "voltcharge", "HG-Hub 2": "homegrid", "SP-5000": "sunpeak", "SC-10": "storacell", "MW-1": "meterwise" };
  const VULNS = [
    { id: "HYPO-2026-0001", hypothetical: true, title: "HYPOTHETICAL: improper authorisation of OCPP SetChargingProfile", component: "vc-ocpp-stack", fixed_in: "1.5.0", cvss: 8.1,
      description: "Clearly labelled hypothetical vulnerability for demonstration. An authenticated but unauthorised client could submit charging profiles, including V2H discharge setpoints.", functions: ["ev_charging", "v2h_discharge"] },
    { id: "HYPO-2026-0002", hypothetical: true, title: "HYPOTHETICAL: missing brute-force throttling on gateway local API", component: "hg-auth-service", fixed_in: "3.1.0", cvss: 7.3,
      description: "Clearly labelled hypothetical vulnerability for demonstration. Local API password authentication lacks rate limiting.", functions: ["hems_command_integrity"] },
  ];
  function versionKey(v) { return (v.match(/\d+|[a-zA-Z]+/g) || []).map((p) => (/^\d+$/.test(p) ? +p : p)); }
  function versionLt(a, b) {
    const x = versionKey(a), y = versionKey(b);
    for (let i = 0; i < Math.max(x.length, y.length); i++) {
      if (x[i] === undefined) return true;
      if (y[i] === undefined) return false;
      if (x[i] === y[i]) continue;
      if (typeof x[i] === typeof y[i]) return x[i] < y[i];
      return typeof x[i] === "number";
    }
    return false;
  }

  class SupplyChain {
    constructor() {
      this.sboms = {};
      this.decisions = {};
      for (const [k, comps] of Object.entries(FW_COMPONENTS)) {
        const [model, ver] = k.split("|");
        this.sboms[k] = { firmware_name: model, firmware_version: ver, spec_version: "1.5", supplier: SUPPLIERS[model],
          filename: `${model.split(" ")[0].toLowerCase()}-${ver}.cdx.json`,
          components: comps.map(([n, v, f]) => ({ name: n, version: v, purl: `pkg:generic/${n}@${v}`, functions: f ? f.split(",") : [] })) };
      }
    }
    addSbom(raw, filename) {
      if (raw.length > 2000000) throw new Error("SBOM too large");
      const doc = JSON.parse(raw);
      if (doc.bomFormat !== "CycloneDX") throw new Error("Not a CycloneDX document");
      const root = (doc.metadata || {}).component || {};
      const comps = (doc.components || []).slice(0, 5000).filter((c) => c && c.name).map((c) => ({
        name: String(c.name).slice(0, 200), version: String(c.version || "").slice(0, 64), purl: c.purl,
        functions: (c.properties || []).filter((p) => p.name === "energyos:function" && p.value).flatMap((p) => p.value.split(",")) }));
      const p = { firmware_name: root.name, firmware_version: root.version, spec_version: doc.specVersion,
        supplier: ((doc.metadata || {}).supplier || {}).name, filename, components: comps };
      this.sboms[`${root.name}|${root.version}`] = p;
      return p;
    }
    applicability(model, fw) {
      const sbom = this.sboms[`${model}|${fw}`];
      const out = [];
      if (!sbom) return out;
      for (const v of VULNS) for (const c of sbom.components) {
        if (c.name !== v.component) continue;
        let status, method;
        if (!c.version) { status = "under_investigation"; method = "name match, version unknown"; }
        else if (versionLt(c.version, v.fixed_in)) { status = "potentially_affected"; method = `version ${c.version} < fixed ${v.fixed_in}`; }
        else { status = "not_affected"; method = `version ${c.version} >= fixed ${v.fixed_in}`; }
        const d = this.decisions[`${v.id}|${model}|${fw}`];
        if (d) { status = d.status; method = `human decision by ${d.by}: ${d.note}`; }
        out.push({ vulnerability: v.id, title: v.title, hypothetical: v.hypothetical, cvss: v.cvss, component: `${c.name}@${c.version}`,
          status, method, functions: v.functions, firmware: `${model} ${fw}` });
      }
      return out;
    }
    exposure(devices) {
      return VULNS.map((v) => {
        const affected = [];
        for (const d of devices) for (const a of this.applicability(d.model, d.firmware))
          if (a.vulnerability === v.id && ["potentially_affected", "confirmed_affected"].includes(a.status))
            affected.push({ device_id: d.id, installation_id: d.installation_id, firmware: `${d.model} ${d.firmware}`, status: a.status });
        return { ...v, affected_devices: affected };
      });
    }
  }

  // ---------------------------------------------------------------- simulator
  class Device {
    constructor(id, inst, kind, firmware) {
      Object.assign(this, { id, installation_id: inst, kind, firmware, true_power_w: 0, setpoint_w: 0, soc_pct: null,
        temperature_c: 25, online: true, silent_until: 0, report_override_w: null, sensor_fault: false });
    }
    get vendor() { return MODELS[this.kind].vendor; }
    get model() { return MODELS[this.kind].model; }
    get rated_w() { return MODELS[this.kind].rated; }
  }

  class Simulator {
    constructor(seed) {
      this.rng = makeRng(seed);
      this.t = 0;
      this.devices = {};
      for (const [inst, cfg] of Object.entries(INSTALLATIONS)) {
        const n = inst.slice(-3);
        for (const kind of ["gateway", "meter", "charger", "inverter", "battery"]) {
          const d = new Device(`${kind.slice(0, 3)}-${n}`, inst, kind, kind === "charger" ? cfg.charger_fw : OTHER_FW[kind]);
          if (kind === "charger") { d.soc_pct = this.rng.uniform(40, 70); d.setpoint_w = this.rng.choice([3700, 7400]); }
          if (kind === "battery") d.soc_pct = this.rng.uniform(40, 70);
          this.devices[d.id] = d;
        }
      }
      this.house = {}; this.cloud = {};
      for (const i of Object.keys(INSTALLATIONS)) { this.house[i] = this.rng.uniform(350, 600); this.cloud[i] = this.rng.uniform(0.6, 1); }
      this.scenario = null;
      this.pending = [];
    }
    dev(inst, kind) { return this.devices[`${kind.slice(0, 3)}-${inst.slice(-3)}`]; }
    activeScenario() { return this.scenario && !this.scenario.done ? this.scenario.key : null; }
    event(d, type, severity = "info", extra = {}) {
      const { client_id = null, ...details } = extra;
      const ev = { id: this.rng.id(), kind: "event", t: this.t, installation_id: d.installation_id, device_id: d.id, device_kind: d.kind,
        vendor: d.vendor, event_type: type, severity, client_id, provenance: "simulated", scenario: this.activeScenario(), details };
      this.pending.push(ev);
      return ev;
    }
    issueCommand(inst, kind, value, client, bypass = false) {
      const gw = this.dev(inst, "gateway"), target = this.dev(inst, kind);
      const cmd = this.rng.id().slice(0, 8);
      if (!bypass) this.event(gw, "command_issued", "info", { client_id: client, target: target.id, command: "set_power", value_w: value, command_id: cmd });
      if (value < 0 && kind === "charger" && target.soc_pct < 20) { this.event(target, "command_rejected", "medium", { client_id: client, reason: "soc_limit" }); return; }
      target.setpoint_w = value;
      this.event(target, "command_received", "info", { client_id: client, command: "set_power", value_w: value, command_id: cmd, via: bypass ? "local_api" : "gateway" });
    }
    startScenario(key) {
      const sc = SCENARIOS[key];
      const run = { key, started_at: this.t, steps: [], duration: sc.duration, ground_truth: {}, done: false };
      this.scenario = run;
      sc.setup(this, run);
      return { key, ground_truth: run.ground_truth };
    }
    runSteps() {
      const run = this.scenario;
      if (!run || run.done) return;
      const el = this.t - run.started_at;
      const rem = [];
      for (const [off, fn] of run.steps) { if (el >= off) fn(this); else rem.push([off, fn]); }
      run.steps = rem;
      if (el >= run.duration && !rem.length) run.done = true;
    }
    tick(dt = 1) {
      this.t += dt;
      this.runSteps();
      const rng = this.rng, tel = [];
      for (const inst of Object.keys(INSTALLATIONS)) {
        const gw = this.dev(inst, "gateway");
        if (rng.random() < 0.02) this.event(gw, "auth_success", "info", { client_id: "app-user-" + inst.slice(-3), method: "oauth_token" });
        if (rng.random() < 0.03) this.event(gw, "api_access", "info", { client_id: "homegrid-cloud", endpoint: "/api/v1/status" });
        if (Math.floor(this.t) % 30 === 0) {
          const pv = -this.dev(inst, "inverter").true_power_w;
          const surplus = pv - this.house[inst] - Math.max(this.dev(inst, "charger").true_power_w, 0);
          const bat = this.dev(inst, "battery");
          const sp = clamp(surplus, -bat.rated_w, bat.rated_w);
          if (Math.abs(sp - bat.setpoint_w) > 200) this.issueCommand(inst, "battery", Math.round(sp / 10) * 10, "hems-optimiser");
        }
      }
      for (const d of Object.values(this.devices)) {
        if (d.kind === "inverter") {
          const c = (this.cloud[d.installation_id] = clamp(this.cloud[d.installation_id] + rng.gauss(0, 0.01), 0.3, 1));
          d.true_power_w = -(d.rated_w * 0.75 * c * (0.9 + 0.1 * Math.sin(this.t / 300)));
          d.temperature_c = 35 + 0.004 * -d.true_power_w + rng.gauss(0, 0.2);
        } else if (d.kind === "charger" || d.kind === "battery") {
          const cap = d.kind === "charger" ? EV_CAP : BAT_CAP;
          let target = d.setpoint_w;
          if (target > 0 && d.soc_pct >= 99.5) target = 0;
          if (target < 0 && d.soc_pct <= 10) target = 0;
          if (!d.online) target = 0;
          d.true_power_w += (target - d.true_power_w) * (1 - Math.exp(-dt / 3));
          const p = d.true_power_w;
          const wh = ((p > 0 ? p * EFF : p / EFF) * dt) / 3600;
          d.soc_pct = clamp(d.soc_pct + (wh / cap) * 100, 0, 100);
          d.temperature_c += (25 + (Math.abs(p) / 1000) * 1.8 - d.temperature_c) * 0.05;
        }
      }
      for (const inst of Object.keys(INSTALLATIONS)) {
        const others = ["charger", "inverter", "battery"].reduce((s, k) => s + this.dev(inst, k).true_power_w, 0);
        this.dev(inst, "meter").true_power_w = this.house[inst] + rng.gauss(0, 25) + others;
      }
      for (const d of Object.values(this.devices)) {
        if (this.t < d.silent_until) continue;
        let m = {};
        let reported = d.true_power_w * (1 + rng.gauss(0, 0.005));
        if (d.report_override_w !== null) reported = d.report_override_w + rng.gauss(0, 20);
        if (d.kind === "meter") {
          const ch = this.dev(d.installation_id, "charger");
          m = { grid_power_w: +reported.toFixed(1), ev_circuit_power_w: +(ch.true_power_w * (1 + rng.gauss(0, 0.01))).toFixed(1) };
        } else if (d.kind === "gateway") {
          m = { cpu_pct: +(12 + rng.gauss(0, 2)).toFixed(1), connected_devices: 4 };
        } else {
          const p = +reported.toFixed(1), v = +(230 + rng.gauss(0, 1.2)).toFixed(1);
          m = { active_power_w: p, commanded_power_w: d.kind !== "inverter" ? d.setpoint_w : null, voltage_v: v, current_a: +(Math.abs(p) / v).toFixed(2) };
        }
        let soc = d.soc_pct, temp = d.temperature_c;
        if (d.sensor_fault) { temp = rng.choice([412, -88, temp]); if (soc !== null) soc = rng.choice([3, 99, soc]); }
        if (soc !== null) m[d.kind === "battery" ? "soc_pct" : "soc_estimate_pct"] = +soc.toFixed(2);
        m.temperature_c = +temp.toFixed(1);
        let state = "online";
        if (d.kind === "charger" || d.kind === "battery") state = d.true_power_w > 150 ? "charging" : d.true_power_w < -150 ? "discharging" : "idle";
        tel.push({ kind: "telemetry", t: this.t, installation_id: d.installation_id, device_id: d.id, device_kind: d.kind, vendor: d.vendor,
          state, measurements: m, provenance: "simulated", scenario: this.activeScenario() });
      }
      const evs = this.pending; this.pending = [];
      return [tel, evs];
    }
  }

  // ---------------------------------------------------------------- scenarios
  const SCENARIOS = {
    normal: { name: "Normal operation", duration: 30, description: "All devices operate normally.",
      expected: "No incidents. Background commands from known clients only.",
      setup: (s, run) => { run.ground_truth = { label: "benign", devices: [] }; } },
    legit_change: { name: "Legitimate EV charging change", duration: 30, description: "Resident boosts charging via the app (inst-002).",
      expected: "Context observation only; top hypothesis: legitimate user activity. No incident.",
      setup: (s, run) => {
        const gw = s.dev("inst-002", "gateway"), c = "app-user-002";
        run.steps = [[3, (s) => { s.event(gw, "auth_success", "info", { client_id: c, method: "oauth_token", user: "resident-002" });
          s.event(gw, "schedule_changed", "info", { client_id: c, user: "resident-002", change: "boost charging to 11 kW until 07:00" });
          s.issueCommand("inst-002", "charger", 11000, c); }]];
        run.ground_truth = { label: "benign", devices: ["cha-002"], expected_hypothesis: "legitimate_user_activity" };
      } },
    suspicious_v2h: { name: "Suspicious V2H discharge command", duration: 40,
      description: "Unknown client brute-forces the gateway, then commands a -9 kW V2H discharge (inst-001).",
      expected: "High-severity cyber-physical incident; hypothesis: unauthorised command; charger firmware exposure attached.",
      setup: (s, run) => {
        const gw = s.dev("inst-001", "gateway"), bad = "unknown-7f3a91";
        const fails = (s) => { for (let i = 0; i < 3; i++) s.event(gw, "auth_failure", "low", { client_id: bad, method: "local_api_password", source_ip: "10.0.8.77" }); };
        run.steps = [[3, fails], [6, fails], [9, (s) => s.event(gw, "auth_success", "info", { client_id: bad, method: "local_api_password", source_ip: "10.0.8.77" })],
          [12, (s) => s.issueCommand("inst-001", "charger", -9000, bad)]];
        run.ground_truth = { label: "malicious", devices: ["gat-001", "cha-001"], expected_hypothesis: "unauthorised_command" };
      } },
    comm_failure: { name: "Communication failure", duration: 35, description: "EV charger stops reporting for 25 s (inst-003).",
      expected: "Incident with communication-fault hypothesis; no cyber indicators.",
      setup: (s, run) => {
        const ch = s.dev("inst-003", "charger"), gw = s.dev("inst-003", "gateway");
        run.steps = [[3, (s) => { ch.silent_until = s.t + 25; s.event(gw, "communication_lost", "medium", { target: ch.id, reason: "no heartbeat" }); }],
          [29, (s) => s.event(gw, "communication_restored", "info", { target: ch.id })]];
        run.ground_truth = { label: "fault", devices: ["cha-003"], expected_hypothesis: "communication_fault" };
      } },
    telemetry_mismatch: { name: "Telemetry inconsistency", duration: 40,
      description: "Charger reports 7.4 kW while the meter's EV circuit sees ~0.3 kW (inst-004).",
      expected: "Cross-device mismatch incident; sensor fault vs integrity issue for human review.",
      setup: (s, run) => {
        const ch = s.dev("inst-004", "charger");
        run.steps = [[3, () => { ch.report_override_w = 7400; ch.setpoint_w = 300; }], [35, () => { ch.report_override_w = null; }]];
        run.ground_truth = { label: "integrity_anomaly", devices: ["cha-004", "met-004"], expected_hypothesis: "sensor_fault" };
      } },
    sensor_fault: { name: "Battery sensor fault", duration: 30,
      description: "Battery reports physically implausible temperature and SOC jumps (inst-002).",
      expected: "Incident with sensor-fault hypothesis; no cyber indicators.",
      setup: (s, run) => {
        const b = s.dev("inst-002", "battery");
        run.steps = [[3, () => { b.sensor_fault = true; }], [25, () => { b.sensor_fault = false; }]];
        run.ground_truth = { label: "fault", devices: ["bat-002"], expected_hypothesis: "sensor_fault" };
      } },
    firmware_fleet: { name: "Fleet probe on vulnerable firmware", duration: 30,
      description: "Unknown clients probe the OCPP endpoint on every charger running firmware 3.2.1.",
      expected: "Single fleet-level incident across installations sharing firmware 3.2.1, enriched with HYPO-2026-0001.",
      setup: (s, run) => {
        const targets = Object.values(s.devices).filter((d) => d.kind === "charger" && d.firmware === "3.2.1").map((d) => d.installation_id);
        run.steps = targets.map((inst, i) => [3 + i * 4, (s) => { const gw = s.dev(inst, "gateway");
          for (let k = 0; k < 2; k++) s.event(gw, "api_access", "low", { client_id: "scanner-" + i, endpoint: "/ocpp/v16/SetChargingProfile", target: s.dev(inst, "charger").id, response: "200" }); }]);
        run.ground_truth = { label: "suspicious_probe", devices: targets.map((i) => "cha-" + i.slice(-3)), expected_hypothesis: "cybersecurity_compromise" };
      } },
  };

  // ---------------------------------------------------------------- detection
  const isUnknown = (c) => c != null && !KNOWN_CLIENTS.has(c) && !c.startsWith("app-user-");
  class DetectionEngine {
    constructor() {
      this.ids = 1; this.authFail = {}; this.sched = {}; this.lastCmd = {}; this.lastSeen = {}; this.lastLabel = {};
      this.offline = new Set(); this.hist = {}; this.repCharger = {}; this.streak = {}; this.prevSoc = {}; this.cool = new Map();
    }
    emit(out, t, rec, rule, title, category, severity, explanation, evidence, o = {}) {
      const { method = "rule", score = null, client = null, cooldown = 60 } = o;
      const key = `${rule}|${rec.device_id}|${client}`;
      const prev = this.cool.get(key);
      if (prev && t - prev.last_t < cooldown) { prev.occurrences++; prev.last_t = t; prev.evidence = prev.evidence.concat(evidence).slice(-20); return; }
      const d = { id: this.ids++, rule, rule_version: "1.0", title, category, method, severity, score, t, last_t: t,
        installation_id: rec.installation_id, device_id: rec.device_id, device_kind: rec.device_kind, vendor: rec.vendor, client_id: client,
        explanation, evidence, occurrences: 1, provenance: rec.provenance, scenario: rec.scenario };
      this.cool.set(key, d);
      out.push(d);
    }
    onEvent(ev, out) {
      const { t, installation_id: inst, event_type: et, client_id: client, details: det } = ev;
      const ref = [{ type: "event", id: ev.id, summary: `${et} client=${client}` }];
      const unknown = isUnknown(client);
      if (et === "auth_failure") {
        const q = (this.authFail[inst] = this.authFail[inst] || []);
        q.push([t, client, ev.id]);
        while (q.length && t - q[0][0] > 60) q.shift();
        if (q.length >= 5) this.emit(out, t, ev, "AUTH_BRUTE_FORCE", "Repeated authentication failures", "cyber", "high",
          `${q.length} failed logins at the gateway within 60 s.`, q.map((e) => ({ type: "event", id: e[2], summary: `auth_failure client=${e[1]}` })), { client });
      }
      if (et === "auth_success") {
        const f = (this.authFail[inst] || []).filter((e) => e[1] === client && t - e[0] <= 120);
        if (f.length >= 3) this.emit(out, t, ev, "AUTH_SUCCESS_AFTER_FAILURES", "Login succeeded after repeated failures", "cyber", "high",
          `Client ${client} authenticated after ${f.length} failures in 120 s (possible credential guessing).`, ref, { client });
      }
      if (unknown && ["auth_success", "command_issued", "command_received", "api_access"].includes(et))
        this.emit(out, t, ev, "UNRECOGNISED_CLIENT", "Unrecognised client identity", "cyber", "high",
          `Client '${client}' is not in the installation's authorised client registry.`, ref, { client, cooldown: 300 });
      if (et === "schedule_changed" && !unknown) {
        this.sched[inst] = t;
        this.emit(out, t, ev, "AUTHORISED_SCHEDULE_CHANGE", "Authorised schedule change (context)", "context", "info",
          `Authenticated known client ${client} changed the charging schedule: ${det.change}.`, ref, { client });
      }
      if (et === "command_received") {
        this.lastCmd[ev.device_id] = [t, det.value_w, client, ev.id];
        const v = det.value_w || 0;
        if (ev.device_kind === "charger" && v < 0 && t - (this.sched[inst] ?? -1e9) > 300)
          this.emit(out, t, ev, "UNEXPECTED_V2H_DISCHARGE", "Unexpected V2H discharge command", "cyber", "high",
            `Charger received a ${(v / 1000).toFixed(1)} kW discharge setpoint with no authorised schedule change in the previous 5 minutes.`, ref, { client });
        if (det.via === "local_api") this.emit(out, t, ev, "GATEWAY_BYPASS", "Command bypassed the HEMS gateway", "cyber", "high",
          "Device accepted a command that the gateway never issued.", ref, { client });
      }
      if (et === "command_rejected") this.emit(out, t, ev, "COMMAND_REJECTED", "Device rejected a command", "cyber", "medium",
        `Device rejected command from ${client}: ${det.reason}.`, ref, { client });
      if (et === "api_access" && unknown && String(det.endpoint || "").includes("/ocpp/"))
        this.emit(out, t, ev, "SENSITIVE_API_PROBE", "Unrecognised client accessed charging-control API", "cyber", "medium",
          `${client} called ${det.endpoint} targeting ${det.target}.`, ref, { client });
      if (et === "communication_lost") this.emit(out, t, ev, "GATEWAY_REPORTED_COMM_LOSS", "Gateway reports device unreachable", "physical", "medium",
        `Gateway lost heartbeat with ${det.target}.`, ref);
    }
    onTelemetry(tm, out) {
      const { t, device_id: dev, measurements: m, device_kind: kind } = tm;
      this.lastSeen[dev] = t; this.lastLabel[dev] = tm.scenario; this.offline.delete(dev);
      const ref = [{ type: "telemetry", device: dev, t, summary: Object.entries(m).map(([k, v]) => `${k}=${v}`).join(", ") }];
      const temp = m.temperature_c;
      if (temp != null && !(temp >= -40 && temp <= 120)) this.emit(out, t, tm, "IMPLAUSIBLE_TEMPERATURE", "Physically implausible temperature", "physical", "medium",
        `Reported ${temp} °C is outside the plausible range -40…120 °C.`, ref);
      const soc = m.soc_pct ?? m.soc_estimate_pct;
      if (soc != null) {
        const prev = this.prevSoc[dev];
        if (prev != null && Math.abs(soc - prev) > 10) this.emit(out, t, tm, "IMPLAUSIBLE_SOC_JUMP", "Implausible state-of-charge jump", "physical", "medium",
          `SOC moved ${prev.toFixed(1)}% → ${soc.toFixed(1)}% in one sample; at rated power this requires minutes, not seconds.`, ref);
        this.prevSoc[dev] = soc;
      }
      const p = m.active_power_w;
      if (p != null && (kind === "charger" || kind === "battery")) {
        const h = (this.hist[dev] = this.hist[dev] || []);
        if (h.length >= 10) {
          const ago = h[h.length - 6];
          if (Math.abs(p - ago) > 3000) {
            const c = this.lastCmd[dev];
            const linked = c && t - c[0] <= 20;
            const known = linked && (KNOWN_CLIENTS.has(c[2]) || c[2] === "app-user-" + tm.installation_id.slice(-3));
            this.emit(out, t, tm, "POWER_STEP_CHANGE", "Large power-flow change", "physical", known ? "low" : "medium",
              `Active power changed ${(ago / 1000).toFixed(1)} → ${(p / 1000).toFixed(1)} kW in 5 s` +
              (linked ? `; follows command ${c[1]} W from ${c[2]} (${(t - c[0]).toFixed(0)} s earlier).` : "; no recent command explains it."),
              ref, { client: linked ? c[2] : null });
          }
        }
        if (h.length >= 30) {
          const mu = h.reduce((a, b) => a + b, 0) / h.length;
          const sd = Math.sqrt(h.reduce((a, b) => a + (b - mu) ** 2, 0) / h.length);
          const z = Math.abs(p - mu) / Math.max(sd, 200);
          if (z > 6 && Math.abs(p - mu) > 2000) this.emit(out, t, tm, "BASELINE_DEVIATION", "Deviation from device baseline", "physical", "low",
            `Power ${p.toFixed(0)} W vs rolling mean ${mu.toFixed(0)} W (z=${z.toFixed(1)}, 60-sample window).`, ref, { method: "statistical", score: +z.toFixed(2) });
        }
        h.push(p); if (h.length > 60) h.shift();
        if (kind === "charger") this.repCharger[tm.installation_id] = p;
      }
      if (kind === "meter") {
        const inst = tm.installation_id, rep = this.repCharger[inst], evc = m.ev_circuit_power_w;
        if (rep != null && evc != null) {
          const gap = Math.abs(rep - evc);
          this.streak[inst] = gap > Math.max(1000, 0.15 * Math.abs(evc)) ? (this.streak[inst] || 0) + 1 : 0;
          if (this.streak[inst] >= 3) this.emit(out, t, { ...tm, device_id: "cha-" + inst.slice(-3), device_kind: "charger", vendor: "voltcharge" },
            "METER_CHARGER_MISMATCH", "Charger telemetry disagrees with meter", "physical", "high",
            `Charger reports ${rep.toFixed(0)} W; independent meter EV circuit measures ${evc.toFixed(0)} W (gap ${gap.toFixed(0)} W for 3+ samples).`, ref);
        }
      }
    }
    liveness(t, devices, out) {
      for (const d of Object.values(devices)) {
        const last = this.lastSeen[d.id];
        if (last != null && t - last > 5 && !this.offline.has(d.id)) {
          this.offline.add(d.id);
          this.emit(out, t, { installation_id: d.installation_id, device_id: d.id, device_kind: d.kind, vendor: d.vendor, provenance: "simulated", scenario: this.lastLabel[d.id] },
            "TELEMETRY_SILENCE", "Device stopped reporting", "physical", "medium", `No telemetry from ${d.id} for ${(t - last).toFixed(0)} s (expected every 1 s).`,
            [{ type: "telemetry", device: d.id, t: last, summary: "last sample received" }]);
        }
      }
    }
    process(t, tel, evs, devices) {
      const out = [];
      for (const e of evs) this.onEvent(e, out);
      for (const tm of [...tel].sort((a, b) => (a.device_kind === "meter") - (b.device_kind === "meter"))) this.onTelemetry(tm, out);
      this.liveness(t, devices, out);
      return out;
    }
  }

  // ---------------------------------------------------------------- correlation
  const SEV_W = { info: 0, low: 1, medium: 3, high: 5, critical: 8 };
  const SEV = ["info", "low", "medium", "high", "critical"];
  const FLEET_RULES = new Set(["SENSITIVE_API_PROBE", "COMMAND_REJECTED", "METER_CHARGER_MISMATCH", "TELEMETRY_SILENCE"]);
  const WINDOW = 180;
  const HLABEL = { unauthorised_command: "Possible unauthorised command", cybersecurity_compromise: "Possible cybersecurity compromise",
    legitimate_user_activity: "Legitimate user activity", communication_fault: "Communication fault", sensor_fault: "Sensor / metering fault",
    firmware_defect: "Firmware defect", integration_failure: "Integration failure" };

  class Correlator {
    constructor(fw) { this.groups = []; this.fw = fw; this.gid = 1; }
    open() { return this.groups.filter((g) => g.status === "open" && g.merged_into == null); }
    add(dets, now) {
      const touched = new Set();
      for (const d of dets) {
        let g = this.open().reverse().find((g) => g.installations.has(d.installation_id) && d.t - g.last_t <= WINDOW);
        if (!g) { g = { id: this.gid++, kind: "installation", status: "open", first_t: d.t, last_t: d.t, installations: new Set(), devices: new Set(),
          vendors: new Set(), clients: new Set(), detections: [], severity: "info", score: 0, hypotheses: [], links: [], incident_id: null, merged_into: null }; this.groups.push(g); }
        this.attach(g, d); touched.add(g.id);
      }
      for (const id of this.fleetMerge()) touched.add(id);
      for (const g of this.groups) if (g.status === "open" && now - g.last_t > WINDOW) g.status = "closed_window";
      const out = this.groups.filter((g) => touched.has(g.id) && g.merged_into == null);
      out.forEach((g) => this.assess(g));
      return out;
    }
    attach(g, d) {
      g.detections.push(d); d.group_id = g.id;
      g.installations.add(d.installation_id); g.devices.add(d.device_id); g.vendors.add(d.vendor);
      if (d.client_id) g.clients.add(d.client_id);
      g.first_t = Math.min(g.first_t, d.t); g.last_t = Math.max(g.last_t, d.t);
    }
    fleetMerge() {
      const touched = [];
      const gs = this.open();
      for (const a of gs) for (const b of gs) {
        if (a === b || a.merged_into || b.merged_into || a.id > b.id) continue;

<script>

const allowed = (v) => !v.perm || [].concat(v.perm).some(can);
function currentView() {

        <ol class="steps">
          <li>As <b>Dana (analyst)</b>, run <i>Suspicious V2H discharge</i>. <button class="btn primary" data-act="demo-run">Run scenario</button></li>
          <li>Watch the gateway brute-force, the −9 kW command and the measured discharge in <a href="#live">Live monitoring</a>.</li>

async function renderLive() {
  const d = await GET("/api/live", { installation: S.inst });
  const devs = d.devices.map((x) => {
    const p = x.last.active_power_w ?? x.last.grid_power_w;
    const extra = x.kind === "meter" ? `EV circuit ${kw(x.last.ev_circuit_power_w)}` : x.last.soc_pct != null ? `SOC ${x.last.soc_pct}%` : x.last.soc_estimate_pct != null ? `EV SOC est. ${x.last.soc_estimate_pct}%` : x.kind === "gateway" ? `CPU ${x.last.cpu_pct ?? "—"}%` : `${x.last.temperature_c ?? "—"} °C`;
    return `<div class="dev"><div class="row" style="justify-content:space-between"><b>${esc(x.id)}</b>${x.online ? `<span class="tag">${esc(x.state)}</span>` : `<span class="tag off">offline</span>`}</div>
      <div class="muted">${esc(x.vendor)} · ${esc(x.model)} · fw ${esc(x.firmware)}</div>
      <div class="big">${p != null ? kw(p) : "&nbsp;"}</div><div class="muted">${esc(extra)}</div></div>`;
  }).join("");
  return `<div class="grid">
    <div class="row"><label for="inst">Installation</label><select id="inst" data-act="inst">${d.installations.map((i) => `<option value="${esc(i.id)}" ${i.id === S.inst ? "selected" : ""}>${esc(i.id)} · ${esc(i.name)} · charger fw ${esc(i.charger_fw)}</option>`).join("")}</select>
      <span class="muted" style="font-size:12px">Sign convention: positive = drawing from the home bus, negative = injecting (discharge, PV).</span></div>
    <div class="devgrid">${devs}</div>
    <div class="panel"><h2>Power flow <span class="muted mono">last 120 s</span></h2>${lineChart(d.series, [
      { key: "charger_reported_w", label: "EV charger (reported)", color: "var(--s1)", width: 2.4 },
      { key: "meter_ev_circuit_w", label: "Meter EV circuit (independent)", color: "var(--s2)", dash: "5 4" },
      { key: "battery_w", label: "Battery", color: "var(--s3)" }, { key: "pv_w", label: "Solar PV", color: "var(--s4)" },
      { key: "grid_w", label: "Grid import", color: "var(--s5)" }])}</div>
    <div class="cols">
      <div class="panel"><h2>Detections</h2><div class="list">${d.detections.map(detItem).join("") || `<div class="notice">No findings for this installation.</div>`}</div></div>
      <div class="panel"><h2>Cyber event stream</h2><div class="scroll"><table><thead><tr><th>Time</th><th>Device</th><th>Event</th><th>Client</th><th>Detail</th></tr></thead><tbody>
        ${d.events.map((e) => `<tr><td class="mono">${hhmmss(e.ts)}</td><td class="mono">${esc(e.device_id)}</td><td>${pretty(e.event_type)}</td><td class="mono">${esc(e.client_id || "")}</td><td class="muted mono">${esc(Object.entries(e.details).map(([k, v]) => k + "=" + v).join(" ").slice(0, 90))}</td></tr>`).join("")}
      </tbody></table></div></div>
    </div></div>`;
}
function detItem(x) {
  return `<div class="item stripe stripe-${esc(x.severity)}"><div class="meta">${sev(x.severity)}<span class="tag ${esc(x.category)}">${esc(x.category)}</span><span class="mono">${hhmmss(x.ts)}</span><span class="mono">${esc(x.device_id)}</span><span class="mono">${esc(x.rule)}</span>${x.occurrences > 1 ? `<span>×${x.occurrences}</span>` : ""}${x.method === "statistical" ? `<span>z=${esc(x.score)}</span>` : ""}</div>
    <div><b>${esc(x.title)}</b> — ${esc(x.explanation)}</div></div>`;
}
function hypotheses(h) {
  return h.map((x, i) => `<div class="hyp ${i === 0 ? "top" : ""}"><span>${esc(x.label)}</span><div class="bar"><i style="width:${Math.round(x.support * 100)}%"></i></div><span class="mono">${Math.round(x.support * 100)}%</span>
    ${x.for.length || x.against.length ? `<small>${x.for.length ? "For: " + esc(x.for.join("; ")) : ""}${x.against.length ? (x.for.length ? " · " : "") + "Against: " + esc(x.against.join("; ")) : ""}</small>` : ""}</div>`).join("");
}

async function renderIncident(id) {
  const i = await GET(`/api/incidents/${id}`);
  if (i.restricted_view) return renderRestrictedIncident(i);
  const orgs = ORGS.filter((o) => o.type !== "security_provider");
  const evidence = [...i.evidence].sort((a, b) => String(a.ts || "~").localeCompare(String(b.ts || "~")));
  const series = Object.entries(i.telemetry);
  const colors = ["var(--s1)", "var(--s3)", "var(--s4)", "var(--s2)"];
  const rows = {};
  series.forEach(([k, pts]) => pts.forEach((p) => ((rows[p.ts] = rows[p.ts] || { ts: p.ts })[k] = p.power_w)));
  const chartRows = Object.values(rows).sort((a, b) => (a.ts < b.ts ? -1 : 1));
  const keys = series.map(([k], n) => ({ key: k, label: k, color: k.includes("EV circuit") ? "var(--s2)" : colors[n % 3], dash: k.includes("EV circuit") ? "5 4" : null }));
  return `<div class="grid">
    <div class="row"><a href="#incidents" class="btn">← All incidents</a><button class="btn" data-act="export" data-id="${i.id}">Export evidence (JSON)</button></div>
    <div class="panel stripe stripe-${esc(i.severity)}">
      <h2><span class="row">${sev(i.severity)} <span class="mono">${esc(i.code)}</span> <span class="tag">${pretty(i.status)}</span> <span class="tag">${esc(i.kind)}</span></span><span class="muted" style="font-size:12px">Human verdict: <b>${esc(i.attack_confirmation)}</b></span></h2>
      <div style="font:600 18px var(--font-display);margin-bottom:4px">${esc(i.title)}</div>
      <div>${esc(i.summary)}</div>

    </div>
    <div class="cols">
      <div class="panel"><h2>Competing hypotheses</h2>${hypotheses(i.hypotheses)}<div class="muted" style="font-size:12px;margin-top:4px">Confidence: ${esc(i.confidence)}. Support is relative evidence weight, not a probability. Only a human can confirm an attack.</div>
        ${i.links.map((l) => `<div class="notice warn" style="margin-top:8px">Cyber → physical: ${esc(l.text)}</div>`).join("")}</div>
      <div class="panel"><h2>Operational impact</h2><div class="scroll"><table><thead><tr><th>Device</th><th>Observed in telemetry</th><th>Functions possibly affected</th></tr></thead><tbody>
        ${i.impact.map((x) => `<tr><td class="mono">${esc(x.device)}<div class="muted">${esc(x.vendor)}</div></td><td>${esc(x.observed || "—")}</td><td>${x.functions_potentially_affected.map((f) => `<span class="tag">${esc(f)}</span>`).join("")}</td></tr>`).join("")}</tbody></table></div></div>
    </div>
    ${chartRows.length ? `<div class="panel"><h2>Physical evidence <span class="muted mono">incident window</span></h2>${lineChart(chartRows, keys)}</div>` : ""}
    <div class="cols-2-1">
      <div class="panel"><h2>Evidence timeline <span class="muted" style="font-size:12px;font-weight:400">tick items to share with a vendor</span></h2><div class="timeline">

          <div class="item stripe stripe-${esc(e.severity)}"><div class="meta">${sev(e.severity)}<span class="tag ${esc(e.category)}">${esc(e.category)}</span><span class="mono">${esc(e.device)}</span>${e.rule ? `<span class="mono">${esc(e.rule)}</span>` : ""}<span>${esc(e.kind)}</span>${Object.entries(i.shares).filter(([, ids]) => ids.includes(e.id)).map(([o]) => `<span class="tag">shared: ${esc(o)}</span>`).join("")}</div>

          ${i.history.map((h) => `<div class="item"><div class="meta"><b>${esc(h.by)}</b><span class="mono">${hhmmss(h.at)}</span></div>${pretty(h.from)} → <b>${pretty(h.to)}</b>${h.reason ? " — " + esc(h.reason) : ""}</div>`).join("") || (i.decisions.length ? "" : `<div class="notice">No human decisions yet.</div>`)}</div></div>

    </div></div>`;
}

}
function renderRestrictedIncident(i) {

    <div class="notice warn">Restricted view for ${esc(ME.org_name)}. ${esc(i.summary)} Installation details, other vendors' telemetry and unshared findings are withheld by the backend.</div>
    <div class="panel stripe stripe-${esc(i.severity)}"><h2><span class="row">${sev(i.severity)} <span class="mono">${esc(i.code)}</span> <span class="tag">${pretty(i.status)}</span></span></h2>
      <h3>Shared evidence (${i.evidence.length})</h3><div class="list">${i.evidence.map((e) => `<div class="item stripe stripe-${esc(e.severity)}"><div class="meta">${sev(e.severity)}<span class="tag ${esc(e.category)}">${esc(e.category)}</span><span class="mono">${esc(e.device)}</span><span class="mono">${hhmmss(e.ts)}</span></div><b>${esc(e.title)}</b> — ${esc(e.explanation)}</div>`).join("") || `<div class="notice">Nothing shared yet.</div>`}</div>
      <h3>Your tasks</h3><div class="list">${i.tasks.map(taskItem).join("") || `<div class="notice">No tasks.</div>`}</div>
      <h3>Shared notes</h3><div class="list">${i.notes.map((n) => `<div class="item"><div class="meta"><b>${esc(n.by)}</b><span>${esc(n.org)}</span></div>${esc(n.body)}</div>`).join("")}</div>
      <textarea id="note" rows="2" placeholder="Note to the security team" style="margin-top:8px"></textarea><div class="row" style="margin-top:6px"><button class="btn" data-act="note" data-id="${i.id}">Add shared note</button></div>
    </div></div>`;
}

async function renderSupply() {
  const d = await GET("/api/supply-chain");
  return `<div class="grid">
    <div class="notice">CycloneDX SBOMs are parsed per firmware. Applicability is decided from component versions against the fixed version; only the vendor can confirm or rule out impact. HYPO-* records are hypothetical demonstration vulnerabilities, not real CVEs.</div>
    <div class="cols">${d.vulnerabilities.map((v) => `<div class="panel stripe stripe-high"><h2><span class="mono">${esc(v.id)}</span><span class="tag">CVSS ${esc(v.cvss)} (hypothetical)</span></h2>
      <b>${esc(v.title)}</b><p class="muted" style="margin:6px 0">${esc(v.description)}</p>
      <div class="row">${v.functions.map((f) => `<span class="tag">${pretty(f)}</span>`).join("")}<span class="tag">fixed in ${esc(v.component)} ${esc(v.fixed_in)}</span></div>
      <h3>Potentially affected deployed devices (${v.affected_devices.length})</h3>
      <div class="row">${v.affected_devices.map((x) => `<span class="tag mono">${esc(x.device_id || "")} ${esc(x.firmware)} · ${pretty(x.status)}</span>`).join("") || `<span class="muted">None</span>`}</div></div>`).join("")}</div>
    <div class="panel"><h2>Firmware &amp; SBOM inventory</h2><div class="scroll"><table><thead><tr><th>Firmware</th><th>Installed</th><th>Components</th><th>Vulnerability applicability</th></tr></thead><tbody>
      ${d.sboms.map((s) => `<tr><td><b>${esc(s.firmware)}</b> <span class="mono">${esc(s.version)}</span><div class="muted mono">${esc(s.file)} · CycloneDX ${esc(s.spec)}</div></td><td class="mono">${s.installed_devices}</td>
        <td>${s.components.map((c) => `<span class="tag mono" title="${esc(c.purl || "")}">${esc(c.name)}@${esc(c.version)}</span>`).join("")}</td>
        <td>${s.applicability.map((a) => `<div style="margin-bottom:4px"><span class="mono">${esc(a.vulnerability)}</span> <span class="tag ${a.status.includes("affected") && !a.status.startsWith("not") ? "bad" : "ok"}">${pretty(a.status)}</span><div class="muted" style="font-size:12px">${esc(a.method)}</div>
          ${d.can_decide ? `<div class="row"><button class="btn" data-act="vex" data-v="${esc(a.vulnerability)}" data-m="${esc(s.firmware)}" data-ver="${esc(s.version)}" data-s="confirmed_affected">Confirm affected</button><button class="btn" data-act="vex" data-v="${esc(a.vulnerability)}" data-m="${esc(s.firmware)}" data-ver="${esc(s.version)}" data-s="not_affected">Not affected</button></div>` : ""}</div>`).join("") || `<span class="muted">No known applicable records</span>`}</td></tr>`).join("")}
    </tbody></table></div></div>
    ${d.can_decide || can("triage") ? `<div class="panel"><h2>Upload a CycloneDX SBOM</h2><div class="grid" style="gap:8px"><input type="file" id="sbom-file" accept=".json,application/json" aria-label="SBOM file"><textarea id="sbom-text" rows="3" placeholder="…or paste CycloneDX JSON here"></textarea><div class="row"><button class="btn primary" data-act="sbom">Parse &amp; add</button></div></div></div>` : ""}
  </div>`;
}

async function renderCoordination() {
  const tasks = await GET("/api/tasks");
  const overdue = tasks.filter((t) => t.overdue).length;
  return `<div class="grid">
    <div class="kpis"><div class="kpi"><span>Open tasks</span><b>${tasks.filter((t) => !["completed", "cancelled"].includes(t.status)).length}</b></div>
      <div class="kpi"><span>Awaiting acknowledgement</span><b>${tasks.filter((t) => t.status === "open").length}</b></div>
      <div class="kpi ${overdue ? "alert" : ""}"><span>Overdue</span><b>${overdue}</b></div>
      <div class="kpi"><span>Completed</span><b>${tasks.filter((t) => t.status === "completed").length}</b></div></div>
    <div class="panel"><h2>${can("view_incidents_all") ? "All coordination tasks" : "Tasks assigned to " + esc(ME.org_name)}</h2>
      <div class="list">${tasks.map((t) => `<div><a class="mono" href="#incident-${t.incident_id}">${esc(t.incident_code)}</a>${taskItem(t)}</div>`).join("") || `<div class="notice">No tasks yet. An analyst assigns them from an incident.</div>`}</div></div></div>`;
}

async function renderSimulation() {
  const d = await GET("/api/scenarios");
  return `<div class="grid">
    <div class="notice">Scenarios change only simulated device behaviour. Detection and correlation process the resulting telemetry and events independently; the results table compares their output with each scenario's ground truth.</div>
    <div class="cols">${d.scenarios.map((s) => `<div class="panel"><h2>${esc(s.name)} <span class="muted mono">${s.duration} s</span></h2><div>${esc(s.description)}</div><div class="muted" style="font-size:12.5px;margin:6px 0 10px">Expected: ${esc(s.expected)}</div><button class="btn primary" data-act="run" data-k="${esc(s.key)}">Run</button></div>`).join("")}</div>
    <div class="panel"><h2>Expected vs actual <span class="row">${S.confirmReset ? `<span class="muted">Clear all incidents, tasks and history?</span><button class="btn danger" data-act="reset-yes">Yes, reset</button><button class="btn" data-act="reset-no">Cancel</button>` : `<button class="btn" data-act="reset">Reset platform</button>`}</span></h2>
      <div class="scroll"><table><thead><tr><th>Run</th><th>Scenario</th><th>Status</th><th>First detection</th><th>Rules fired</th><th>Incidents</th><th>Top hypothesis</th><th>Matches ground truth</th></tr></thead><tbody>
      ${d.runs.map((r) => `<tr><td class="mono">#${r.id}</td><td>${esc(r.name)}</td><td><span class="tag">${esc(r.status)}</span></td><td class="mono">${r.first_detection_s != null ? "+" + r.first_detection_s + " s" : "—"}</td>
        <td>${[...new Set(r.detections.map((x) => x.rule))].map((x) => `<span class="tag mono">${esc(x)}</span>`).join("") || "—"}</td>
        <td>${r.incidents.map((c) => `<a class="mono" href="#incident-${+c.split("-").pop()}">${esc(c)}</a>`).join(" ") || "none"}</td>
        <td>${pretty(r.top_hypotheses[0] || "—")}<div class="muted" style="font-size:12px">expected: ${pretty(r.ground_truth.expected_hypothesis || "no incident")}</div></td>
        <td class="${r.hypothesis_match ? "ok" : "bad"}">${r.status === "running" ? "…" : r.hypothesis_match ? "✓ yes" : "✗ no"}</td></tr>`).join("") || `<tr><td colspan="8" class="muted">No runs yet.</td></tr>`}
      </tbody></table></div></div></div>`;
}

async function renderAudit() {
  const a = await GET("/api/audit");
  return `<div class="panel"><h2>Audit trail <span class="${a.chain_valid ? "ok" : "bad"}">${a.chain_valid ? "Hash chain verified" : "Hash chain broken"}</span></h2>
    <div class="scroll"><table><thead><tr><th>#</th><th>Time</th><th>Actor</th><th>Action</th><th>Resource</th><th>Details</th><th>Hash</th></tr></thead><tbody>
    ${a.records.map((r) => `<tr><td class="mono">${r.seq}</td><td class="mono">${hhmmss(r.at)}</td><td>${esc(r.actor_name)}</td><td class="mono">${esc(r.action)}</td><td class="mono">${esc(r.resource)}</td><td class="muted mono" style="max-width:340px">${esc(JSON.stringify(r.details)).slice(0, 160)}</td><td class="mono muted">${esc(String(r.hash || "").slice(0, 10))}</td></tr>`).join("")}
    </tbody></table></div></div>`;
}

// ------------------------------------------------------------------ render loop with form preservation
let rendering = false;
async function render() {
  if (rendering || !ME) return;
  rendering = true;
  const name = currentView();
  const view = document.getElementById("view");
  try {
    document.getElementById("page-title").textContent = S.incident ? "Incident investigation" : VIEWS[name].title;
    const html = await VIEWS[name].render();
    const saved = {}, active = document.activeElement && document.activeElement.id;
    let sel = null;
    view.querySelectorAll("[id]").forEach((el) => { if ("value" in el && el.type !== "file") saved[el.id] = el.value; });
    if (active && document.activeElement.selectionStart != null) sel = [document.activeElement.selectionStart, document.activeElement.selectionEnd];
    view.innerHTML = html;
    for (const [k, v] of Object.entries(saved)) { const el = document.getElementById(k); if (el && el.tagName !== "SELECT" && v) el.value = v; else if (el && el.id === "task-org" && v) el.value = v; }
    if (active) { const el = document.getElementById(active); if (el) { el.focus(); if (sel && el.setSelectionRange) try { el.setSelectionRange(...sel); } catch (e) {} } }
  } catch (e) {
    view.innerHTML = `<div class="notice warn">${esc(e.message)}</div>`;
  }
  renderNav(name);
  try { const o = await GET("/api/overview"); document.getElementById("clock").innerHTML = `<span class="dot"></span>sim t=${o.sim_time_s} s · ${o.detections_total} findings`; } catch (e) {}
  rendering = false;
}

async function signIn(uid) {
  const { token } = await POST("/api/login", { user_id: uid });
  TOKEN = token; ME = await GET("/api/me"); storeSet("eos-user", uid);
  document.getElementById("identity").value = uid;
  S.evSel.clear();
  if (!allowed(VIEWS[currentView()]) || (location.hash.startsWith("#incident-") && !can("view_incidents_all") && !can("view_shared"))) location.hash = "overview";
  await render();
}

document.addEventListener("click", async (ev) => {
  const el = ev.target.closest("[data-act]");
  if (!el || el.tagName === "SELECT" || el.type === "checkbox") return;
  const a = el.dataset.act, id = el.dataset.id;
  const val = (x) => (document.getElementById(x) || {}).value || "";
  try {
    if (a === "open-inc") { location.hash = "incident-" + id; return; }
    if (a === "as") { await signIn(el.dataset.user); toast("Signed in as " + ME.name); return; }
    if (a === "demo-run") { if (!can("simulate")) await signIn("u-analyst"); await POST("/api/scenarios/suspicious_v2h/start"); S.inst = "inst-001"; location.hash = "live"; toast("Scenario started: watch inst-001"); return; }
    if (a === "demo-open") { const l = await GET("/api/incidents"); if (!l.length) return toast("No incident yet — run the scenario first"); location.hash = "incident-" + l[0].id; return; }
    if (a === "run") { await POST(`/api/scenarios/${el.dataset.k}/start`); toast("Scenario started"); }
    if (a === "reset") { S.confirmReset = true; }
    if (a === "reset-no") { S.confirmReset = false; }
    if (a === "reset-yes") { await POST("/api/simulation/reset"); S.confirmReset = false; toast("Platform reset"); }
    if (a === "decide") { await POST(`/api/incidents/${id}/decision`, { decision: el.dataset.d, rationale: val("reason") }); document.getElementById("reason").value = ""; toast("Decision recorded"); }
    if (a === "status") { await POST(`/api/incidents/${id}/status`, { status: el.dataset.s, reason: val("reason") }); document.getElementById("reason").value = ""; toast("Status updated"); }
    if (a === "note") { if (!val("note")) return toast("Write a note first"); await POST(`/api/incidents/${id}/notes`, { body: val("note") }); document.getElementById("note").value = ""; toast("Note added"); }
    if (a === "task") { if (!val("task-title")) return toast("Give the task a title"); await POST(`/api/incidents/${id}/tasks`, { org: val("task-org"), title: val("task-title"), due_hours: +val("task-due") || 48, evidence_ids: [...S.evSel] });
      document.getElementById("task-title").value = ""; S.evSel.clear(); toast("Task assigned"); }
    if (a === "share") { await POST(`/api/incidents/${id}/share`, { org: val("task-org"), evidence_ids: [...S.evSel] }); S.evSel.clear(); toast("Evidence shared"); }
    if (a === "task-upd") { const c = val("tc-" + id); await POST(`/api/tasks/${id}`, { status: el.dataset.s || null, comment: c }); const i = document.getElementById("tc-" + id); if (i) i.value = ""; toast("Task updated"); }
    if (a === "vex") { await POST("/api/supply-chain/decision", { vulnerability: el.dataset.v, model: el.dataset.m, version: el.dataset.ver, status: el.dataset.s, note: "Vendor product-security assessment" }); toast("Applicability decision recorded"); }
    if (a === "sbom") {
      const f = document.getElementById("sbom-file").files[0];
      const content = f ? await f.text() : val("sbom-text");
      if (!content) return toast("Choose a file or paste JSON");
      const r = await POST("/api/supply-chain/sbom", { content, filename: f ? f.name : "pasted.json" });
      toast(`Parsed ${r.firmware} ${r.version}: ${r.components} components`);
    }
    if (a === "export") { const data = await GET(`/api/incidents/${id}/export`); showModal("Evidence export", JSON.stringify(data, null, 2)); return; }
    if (a === "copy") { const t = document.getElementById("modal-pre").textContent; try { await navigator.clipboard.writeText(t); toast("Copied"); } catch (e) { const r = document.createRange(); r.selectNodeContents(document.getElementById("modal-pre")); getSelection().removeAllRanges(); getSelection().addRange(r); toast("Selected — press Ctrl/⌘+C"); } return; }
    if (a === "close-modal") { document.getElementById("modal").hidden = true; return; }
    await render();
  } catch (e) { toast(e.message); }
});
document.addEventListener("change", async (ev) => {
  const el = ev.target;
  if (el.id === "identity") return signIn(el.value).catch((e) => toast(e.message));
  if (el.dataset.act === "inst") { S.inst = el.value; return render(); }
  if (el.dataset.act === "evsel") { el.checked ? S.evSel.add(el.value) : S.evSel.delete(el.value); render(); }
});
function showModal(title, text) {
  const m = document.getElementById("modal");
  m.innerHTML = `<div class="panel" role="dialog" aria-label="${esc(title)}"><h2>${esc(title)}<span class="row"><button class="btn" data-act="copy">Copy</button><button class="btn" data-act="close-modal">Close</button></span></h2><pre id="modal-pre">${esc(text)}</pre></div>`;
  m.hidden = false;
}
window.addEventListener("hashchange", () => { S.evSel.clear(); render(); });

(async function boot() {
  MODE = await detectMode();
  document.getElementById("mode-chip").innerHTML = `<span class="chip"><span class="dot"></span>${MODE === "server" ? "Python backend" : "In-browser engine"}</span>`;
  USERS = await GET("/api/users");
  document.getElementById("identity").innerHTML = USERS.map((u) => `<option value="${esc(u.id)}">${esc(u.name)} — ${pretty(u.role)}, ${esc(u.org_name)}</option>`).join("");
  await signIn("u-analyst");
  ORGS = await GET("/api/orgs");
  setInterval(render, 2000);
})();
})();
</script>
