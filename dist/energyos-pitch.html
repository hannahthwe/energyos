  const tabs = [["vulns", "Vulnerabilities", d.vulnerabilities.length], ["sboms", "Firmware & SBOM", d.sboms.length], ["assets", "Devices"], ["upload", "Upload SBOM"]];
  let body = "";
  if (S.stab === "vulns") body = card("Vulnerability exposure", `<div class="tw"><table><thead><tr><th>ID</th><th>Title</th><th>CVSS</th><th>Component</th><th>Functions</th><th>Exposed assets</th></tr></thead><tbody>
    ${d.vulnerabilities.map((v) => `<tr><td class="mono sevcell high">${esc(v.id)}<div><span class="st open" style="font-size:10px">hypothetical</span></div></td><td><b>${esc(v.title)}</b><div class="muted" style="font-size:12px;max-width:60ch">${esc(v.description)}</div></td>
      <td class="mono num">${esc(v.cvss)}</td><td class="mono">${esc(v.component)} &lt; ${esc(v.fixed_in)}</td><td>${v.functions.map((f) => `<span class="tag">${pretty(f)}</span>`).join("")}</td>
      <td><b class="num">${v.affected_devices.length}</b><div>${v.affected_devices.map((x) => `<span class="tag mono">${esc(x.device_id || x.firmware)}</span>`).join("")}</div></td></tr>`).join("")}</tbody></table></div>`,
    { flush: true, meta: "version-range applicability" });
  if (S.stab === "sboms") body = card("Firmware and SBOM inventory", `<div class="tw"><table><thead><tr><th>Firmware</th><th>Installed</th><th>Components (CycloneDX)</th><th>Applicability</th></tr></thead><tbody>
    ${d.sboms.map((s) => `<tr><td><b>${esc(s.firmware)}</b> <span class="mono">${esc(s.version)}</span><div class="faint mono" style="font-size:11px">${esc(s.file)} · spec ${esc(s.spec)}</div></td><td class="num">${s.installed_devices}</td>
      <td>${s.components.map((c) => `<span class="tag mono" title="${esc(c.purl || "")}">${esc(c.name)}@${esc(c.version)}</span>`).join("")}</td>
      <td>${s.applicability.map((a) => `<div style="margin-bottom:6px"><span class="mono">${esc(a.vulnerability)}</span> <span class="st ${a.status === "not_affected" ? "closed" : "new"}">${pretty(a.status)}</span><div class="faint" style="font-size:11.5px">${esc(a.method)}</div>
        ${d.can_decide ? `<div class="row" style="margin-top:3px"><button class="btn sm" data-act="vex" data-v="${esc(a.vulnerability)}" data-m="${esc(s.firmware)}" data-ver="${esc(s.version)}" data-s="confirmed_affected">Confirm affected</button><button class="btn sm" data-act="vex" data-v="${esc(a.vulnerability)}" data-m="${esc(s.firmware)}" data-ver="${esc(s.version)}" data-s="not_affected">Not affected</button></div>` : ""}</div>`).join("") || `<span class="faint">No applicable records</span>`}</td></tr>`).join("")}</tbody></table></div>`, { flush: true });
  if (S.stab === "assets") { const f = await GET("/api/fleet"); const rows = sortRows("fleet", f.devices, { key: "installation", dir: "asc" });
    body = card("Devices", `<div class="tw"><table><thead><tr>${th("fleet", "installation", "Home")}${th("fleet", "id", "Device")}${th("fleet", "kind", "Type")}${th("fleet", "vendor", "Vendor")}${th("fleet", "model", "Model")}${th("fleet", "firmware", "Firmware")}<th>Status</th></tr></thead><tbody>
      ${rows.map((x) => `<tr><td class="mono">${esc(x.installation)}</td><td class="mono">${esc(x.id)}</td><td>${esc(KIND[x.kind])}</td><td>${esc(x.vendor)}</td><td>${esc(x.model)}</td><td class="mono">${esc(x.firmware)}</td><td><span class="dot ${x.online ? "" : "off"}"></span> ${x.online ? "Online" : "Offline"}</td></tr>`).join("")}</tbody></table></div>`, { flush: true, meta: can("view_fleet") ? `${f.devices.length} devices` : "your products only; homes withheld" }); }
  if (S.stab === "upload") body = d.can_decide || can("triage") ? card("Ingest a CycloneDX SBOM", `<div class="stack" style="gap:8px;max-width:720px"><input type="file" id="sbom-file" accept=".json,application/json" aria-label="SBOM file">
    <textarea id="sbom-text" rows="6" class="mono" placeholder='…or paste CycloneDX JSON: {"bomFormat":"CycloneDX","specVersion":"1.5", …}'></textarea>
    <div class="row"><button class="btn primary" data-act="sbom">Parse and ingest</button><span class="note">Validated as CycloneDX, size-limited, components matched against known vulnerabilities.</span></div></div>`) : card("Ingest", empty("Your role cannot ingest SBOMs."));
  return `${head("Supply chain", "Which devices run software with known vulnerabilities. Matching gives “potentially affected”; only the manufacturer confirms impact. HYPO-* records are hypothetical.")}
  <div class="tabs">${tabs.map(([k, l, n]) => `<button class="${S.stab === k ? "on" : ""}" data-act="stab" data-tab="${k}">${l}${n != null ? `<span class="cnt">${n}</span>` : ""}</button>`).join("")}</div>${body}`;
}

async function renderSimulation() {
  const d = await GET("/api/scenarios");
  return `${head("Demo lab", "Each scenario only changes how simulated devices behave. The platform works out what happened on its own, and each run is scored against the expected result.",
    S.confirmReset ? `<span class="muted">Clear all incidents, tasks and history?</span><button class="btn danger" data-act="reset-yes">Reset</button><button class="btn" data-act="reset-no">Cancel</button>` : `<button class="btn" data-act="reset">Reset platform</button>`)}
  <div class="stack">
  ${card("Scenario catalogue", `<div class="tw"><table><thead><tr><th>Scenario</th><th>Behaviour injected</th><th>Expected outcome</th><th>Duration</th><th></th></tr></thead><tbody>
    ${d.scenarios.map((s) => `<tr><td><b>${esc(s.name)}</b><div class="faint mono">${esc(s.key)}</div></td><td>${esc(s.description)}</td><td class="muted">${esc(s.expected)}</td><td class="mono">${s.duration} s</td><td><button class="btn sm primary" data-act="run" data-k="${esc(s.key)}">Run</button></td></tr>`).join("")}</tbody></table></div>`, { flush: true })}
  ${card("Runs: expected vs actual", `<div class="tw"><table><thead><tr><th>Run</th><th>Scenario</th><th>Status</th><th>Time to first finding</th><th>Rules fired</th><th>Incidents</th><th>Top hypothesis</th><th>Ground truth</th></tr></thead><tbody>
    ${d.runs.map((r) => `<tr><td class="mono">#${r.id}</td><td>${esc(r.name)}</td><td>${st(r.status)}</td><td class="mono">${r.first_detection_s != null ? "+" + r.first_detection_s + " s" : "—"}</td>
      <td>${[...new Set(r.detections.map((x) => x.rule))].map((x) => `<span class="tag mono">${esc(x)}</span>`).join("") || "—"}</td>
      <td>${r.incidents.map((c) => `<a class="mono" href="#incident-${+c.split("-").pop()}">${esc(c)}</a>`).join(" ") || '<span class="faint">none</span>'}</td>
      <td>${pretty(r.top_hypotheses[0] || "—")}<div class="faint" style="font-size:11.5px">expected: ${pretty(r.ground_truth.expected_hypothesis || "no incident")}</div></td>
      <td class="${r.hypothesis_match ? "ok" : "bad"}">${r.status === "running" ? '<span class="muted">running…</span>' : r.hypothesis_match ? "✓ Match" : "✗ Mismatch"}</td></tr>`).join("") || `<tr><td colspan="8">${empty("No runs yet.")}</td></tr>`}</tbody></table></div>`, { flush: true })}</div>`;
}

async function renderAudit() {
  const a = await GET("/api/audit");
  return `${head("Audit log", "Every human and system action, chained with SHA-256 so any edit to history breaks verification.", `<span class="st ${a.chain_valid ? "closed" : "new"}">${a.chain_valid ? "✓ Hash chain verified" : "✗ Chain broken"}</span>`)}
  ${card("Records", `<div class="tw"><table><thead><tr><th>#</th><th>Time</th><th>Actor</th><th>Action</th><th>Resource</th><th>Details</th><th>Hash</th></tr></thead><tbody>
    ${a.records.map((r) => `<tr><td class="mono">${r.seq}</td><td class="mono">${hms(r.at)}</td><td>${esc(r.actor_name)}</td><td class="mono">${esc(r.action)}</td><td class="mono">${esc(r.resource)}</td><td class="faint mono" style="max-width:360px;font-size:11px">${esc(JSON.stringify(r.details)).slice(0, 160)}</td><td class="mono faint">${esc(String(r.hash || "").slice(0, 12))}</td></tr>`).join("")}</tbody></table></div>`, { flush: true, meta: `${a.records.length} records` })}`;
}

async function renderSearch() {
  const q = S.q.trim().toLowerCase();
  if (!q) return head("Search", "Type in the search bar above.");
  const has = (o) => JSON.stringify(o).toLowerCase().includes(q);
  const incs = (can("view_incidents_all") || can("view_shared")) ? (await GET("/api/incidents")).filter(has) : [];
  const devs = (can("view_fleet") || can("vex")) ? (await GET("/api/fleet")).devices.filter(has) : [];
  const vulns = (can("view_fleet") || can("vex")) ? (await GET("/api/supply-chain")).vulnerabilities.filter(has) : [];
  const groups = can("view_incidents_all") ? (await GET("/api/correlations")).filter(has) : [];
  return `${head(`Results for “${esc(S.q)}”`, `${incs.length + devs.length + vulns.length + groups.length} matches`)}<div class="stack">
    ${card("Incidents", incs.length ? `<table><tbody>${incs.map((i) => `<tr class="click" data-act="open-inc" data-id="${i.id}"><td class="mono">${esc(i.code)}</td><td>${sev(i.severity)}</td><td>${esc(i.title)}</td></tr>`).join("")}</tbody></table>` : empty("None"), { flush: true })}
    ${card("Correlation groups", groups.length ? `<table><tbody>${groups.map((g) => `<tr><td class="mono">Group ${g.id}</td><td>${sev(g.severity)}</td><td>${esc(g.installations.join(", "))}</td><td>${esc((g.hypotheses[0] || {}).label || "")}</td></tr>`).join("")}</tbody></table>` : empty("None"), { flush: true })}
    ${card("Assets", devs.length ? `<table><tbody>${devs.map((d) => `<tr><td class="mono">${esc(d.id)}</td><td>${esc(d.vendor)} ${esc(d.model)}</td><td class="mono">fw ${esc(d.firmware)}</td><td class="mono">${esc(d.installation)}</td></tr>`).join("")}</tbody></table>` : empty("None"), { flush: true })}
    ${card("Vulnerabilities", vulns.length ? `<table><tbody>${vulns.map((v) => `<tr><td class="mono">${esc(v.id)}</td><td>${esc(v.title)}</td></tr>`).join("")}</tbody></table>` : empty("None"), { flush: true })}</div>`;
}

// ================================================================== render loop (preserves form state across refresh)
let rendering = false;
async function render() {
  if (rendering || !ME) return;
  rendering = true;
  const name = currentView(), view = document.getElementById("view");
  try {
    const html = await VIEWS[name].render();
    const saved = {}, activeId = document.activeElement && document.activeElement.id;
    let sel = null;
    view.querySelectorAll("input[id],textarea[id],select[id]").forEach((el) => { if (el.type !== "file") saved[el.id] = el.value; });
    if (activeId && document.activeElement.selectionStart != null) sel = [document.activeElement.selectionStart, document.activeElement.selectionEnd];
    const scroll = view.scrollTop;
    view.innerHTML = html;
    for (const [k, v] of Object.entries(saved)) { const el = document.getElementById(k); if (el && v !== "" && el.closest("#view")) el.value = v; }
    if (activeId && activeId !== "q") { const el = document.getElementById(activeId); if (el) { el.focus({ preventScroll: true }); if (sel && el.setSelectionRange) try { el.setSelectionRange(...sel); } catch (e) {} } }
    view.scrollTop = scroll;
  } catch (e) {
    view.innerHTML = head("Something went wrong", "") + card("Error", `<div class="callout">${esc(e.message)}</div>`);
  }
  renderNav(name);
  try {
    const o = S.lastOverview && name === "overview" ? S.lastOverview : await GET("/api/overview");
    navCounts.incidents = o.awaiting_review || 0;
    const bell = document.getElementById("bell");
    bell.innerHTML = bell.innerHTML.replace(/<span class="badge">.*?<\/span>/, "") + (o.awaiting_review && (can("view_incidents_all") || can("view_shared")) ? `<span class="badge">${o.awaiting_review}</span>` : "");
    bell.hidden = !(can("view_incidents_all") || can("view_shared"));
    document.getElementById("clock").textContent = `SIMULATION · t+${o.sim_time_s}s`;
  } catch (e) {}
  S.lastOverview = null;
  rendering = false;
}

async function signIn(uid) {
  const { token } = await POST("/api/login", { user_id: uid });
  TOKEN = token; ME = await GET("/api/me");
  document.getElementById("identity").value = uid;
  document.getElementById("avatar").textContent = initials(ME.name);
  S.evSel.clear();
  const v = currentView();
  if (location.hash.startsWith("#incident-") && !(can("view_incidents_all") || can("view_shared"))) location.hash = "overview";
  else if (location.hash && !location.hash.startsWith("#incident-") && v !== location.hash.slice(1)) location.hash = "overview";
  await render();
}

document.addEventListener("click", async (ev) => {
  const el = ev.target.closest("[data-act]");
  if (!el || el.tagName === "SELECT" || el.type === "checkbox" || el.tagName === "INPUT") return;
  const a = el.dataset.act, id = el.dataset.id;
  const val = (x) => (document.getElementById(x) || {}).value || "";
  try {
    if (a === "open-inc") { location.hash = "incident-" + id; return; }
    if (a === "inst") { S.inst = id; }
    if (a === "tab") { S.tab = el.dataset.tab; }
    if (a === "stab") { S.stab = el.dataset.tab; }
    if (a === "filter") { S[el.dataset.f] = el.dataset.v; }
    if (a === "sort") { const cur = S.sort[el.dataset.t]; S.sort[el.dataset.t] = { key: el.dataset.k, dir: cur && cur.key === el.dataset.k && cur.dir === "desc" ? "asc" : "desc" }; }
    if (a === "as") { await signIn(el.dataset.user); toast("Signed in as " + ME.name); return; }
    if (a === "demo-run") { if (!can("simulate")) await signIn("u-analyst"); await POST("/api/scenarios/suspicious_v2h/start"); S.inst = "inst-001"; location.hash = "live"; toast("Scenario started: watch inst-001"); return; }
    if (a === "demo-open") { const l = await GET("/api/incidents"); if (!l.length) return toast("No incident yet. Run the scenario first."); location.hash = "incident-" + l[0].id; return; }
    if (a === "run") { await POST(`/api/scenarios/${el.dataset.k}/start`); toast("Scenario started"); }
    if (a === "reset") S.confirmReset = true;
    if (a === "reset-no") S.confirmReset = false;
    if (a === "reset-yes") { await POST("/api/simulation/reset"); S.confirmReset = false; toast("Platform reset"); }
    if (a === "decide") { await POST(`/api/incidents/${id}/decision`, { decision: el.dataset.d, rationale: val("reason") }); document.getElementById("reason").value = ""; toast("Decision recorded"); }
    if (a === "status") { await POST(`/api/incidents/${id}/status`, { status: el.dataset.s, reason: val("reason") }); document.getElementById("reason").value = ""; toast("Status updated"); }
    if (a === "note") { if (!val("note")) return toast("Write a note first"); await POST(`/api/incidents/${id}/notes`, { body: val("note") }); document.getElementById("note").value = ""; toast("Note added"); }
    if (a === "task") { if (!val("task-title")) return toast("Give the task a title"); await POST(`/api/incidents/${id}/tasks`, { org: val("task-org"), title: val("task-title"), due_hours: +val("task-due") || 48, evidence_ids: [...S.evSel] });
      document.getElementById("task-title").value = ""; S.evSel.clear(); toast("Task assigned"); }
    if (a === "share") { await POST(`/api/incidents/${id}/share`, { org: val("task-org"), evidence_ids: [...S.evSel] }); S.evSel.clear(); toast("Evidence shared"); }
    if (a === "task-upd") { const c = val("tc-" + id); if (!el.dataset.s && !c) return toast("Write a reply first"); await POST(`/api/tasks/${id}`, { status: el.dataset.s || null, comment: c }); const i = document.getElementById("tc-" + id); if (i) i.value = ""; toast("Task updated"); }
    if (a === "vex") { await POST("/api/supply-chain/decision", { vulnerability: el.dataset.v, model: el.dataset.m, version: el.dataset.ver, status: el.dataset.s, note: "Vendor product-security assessment" }); toast("Applicability decision recorded"); }
    if (a === "sbom") {
      const f = document.getElementById("sbom-file").files[0], content = f ? await f.text() : val("sbom-text");
      if (!content) return toast("Choose a file or paste JSON");
      const r = await POST("/api/supply-chain/sbom", { content, filename: f ? f.name : "pasted.json" });
      toast(`Ingested ${r.firmware} ${r.version}: ${r.components} components`); S.stab = "sboms";
    }
    if (a === "export") { const data = await GET(`/api/incidents/${id}/export`); showModal("Evidence export (JSON)", JSON.stringify(data, null, 2)); return; }
    if (a === "copy") { const t = document.getElementById("modal-pre").textContent; try { await navigator.clipboard.writeText(t); toast("Copied"); } catch (e) { const r = document.createRange(); r.selectNodeContents(document.getElementById("modal-pre")); getSelection().removeAllRanges(); getSelection().addRange(r); toast("Selected. Press Ctrl/⌘+C."); } return; }
    if (a === "close-modal") { document.getElementById("modal").hidden = true; return; }
    await render();
  } catch (e) { toast(e.message); }
});
document.addEventListener("keydown", (ev) => { if (ev.key === "Enter" && ev.target.dataset && ev.target.dataset.act === "inst") ev.target.click(); if (ev.key === "Escape") document.getElementById("modal").hidden = true; });
document.addEventListener("change", async (ev) => {
  const el = ev.target;
  if (el.id === "identity") return signIn(el.value).catch((e) => toast(e.message));
  if (el.dataset.act === "evsel") { el.checked ? S.evSel.add(el.value) : S.evSel.delete(el.value); const m = document.getElementById("selcount"); if (m) m.textContent = `${S.evSel.size} selected for sharing`; }
});
document.getElementById("searchform").addEventListener("submit", (ev) => { ev.preventDefault(); S.q = document.getElementById("q").value; if (location.hash === "#search") render(); else location.hash = "search"; });
function showModal(title, text) {
  const m = document.getElementById("modal");
  m.innerHTML = card(esc(title), `<pre id="modal-pre">${esc(text)}</pre>`, { actions: `<button class="btn sm" data-act="copy">Copy</button><button class="btn sm" data-act="close-modal">Close</button>` });
  m.hidden = false;
}
window.addEventListener("hashchange", () => { S.evSel.clear(); render(); document.getElementById("view").scrollTop = 0; });

(async function boot() {
  MODE = await detectMode();
  USERS = await GET("/api/users");
  document.getElementById("identity").innerHTML = USERS.map((u) => `<option value="${esc(u.id)}">${esc(u.name)} · ${pretty(u.role)} · ${esc(u.org_name)}</option>`).join("");
  await signIn("u-analyst");
  ORGS = await GET("/api/orgs");
  setInterval(render, 2000);
})();
})();
</script>
