<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EnergyOS Secure</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: OT security operations console — app bar, grouped nav, dense panels and queues, status bar. Dark-first. */
:root {
  --bg: #0a0e13; --panel: #10161d; --panel-2: #151d26; --hover: #1a2430; --line: #212c38; --line-2: #2b3846;
  --fg: #d5dde5; --fg-strong: #f1f5f8; --muted: #7c8a98; --faint: #56636f;
  --accent: #4c9bf5; --accent-soft: rgb(76 155 245 / .14); --accent-ink: #04111f; --logo-ink: #ffffff; --amber: #f2a93b;
  --crit: #ff4f62; --high: #ff8b3d; --med: #ecc94b; --low: #59a9ff; --info: #8796a4; --ok: #3fcf8e;
  --crit-bg: rgb(255 79 98 / .12); --high-bg: rgb(255 139 61 / .12); --med-bg: rgb(236 201 75 / .12); --low-bg: rgb(89 169 255 / .12); --info-bg: rgb(135 150 164 / .12); --ok-bg: rgb(63 207 142 / .12);
  --s1: #4c9bf5; --s2: #f2a93b; --s3: #3fcf8e; --s4: #b38cff; --s5: #8796a4;
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #eef1f4; --panel: #ffffff; --panel-2: #f6f8fa; --hover: #eef3f8; --line: #dde3e9; --line-2: #c9d2db;
  --fg: #1d2833; --fg-strong: #0b141c; --muted: #5d6b78; --faint: #8a96a2;
  --accent: #1f6fd1; --accent-soft: rgb(31 111 209 / .10); --accent-ink: #ffffff; --logo-ink: #ffffff; --amber: #b86e00;
  --crit: #d12339; --high: #c95514; --med: #957300; --low: #1f6fd1; --info: #687786; --ok: #138a55;
  --crit-bg: rgb(209 35 57 / .09); --high-bg: rgb(201 85 20 / .09); --med-bg: rgb(149 115 0 / .10); --low-bg: rgb(31 111 209 / .09); --info-bg: rgb(104 119 134 / .10); --ok-bg: rgb(19 138 85 / .09);
  --s1: #1f6fd1; --s2: #b86e00; --s3: #138a55; --s4: #7a4fd6; --s5: #687786; color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #eef1f4; --panel: #ffffff; --panel-2: #f6f8fa; --hover: #eef3f8; --line: #dde3e9; --line-2: #c9d2db;
  --fg: #1d2833; --fg-strong: #0b141c; --muted: #5d6b78; --faint: #8a96a2;
  --accent: #1f6fd1; --accent-soft: rgb(31 111 209 / .10); --accent-ink: #ffffff; --logo-ink: #ffffff; --amber: #b86e00;
  --crit: #d12339; --high: #c95514; --med: #957300; --low: #1f6fd1; --info: #687786; --ok: #138a55;
  --crit-bg: rgb(209 35 57 / .09); --high-bg: rgb(201 85 20 / .09); --med-bg: rgb(149 115 0 / .10); --low-bg: rgb(31 111 209 / .09); --info-bg: rgb(104 119 134 / .10); --ok-bg: rgb(19 138 85 / .09);
  --s1: #1f6fd1; --s2: #b86e00; --s3: #138a55; --s4: #7a4fd6; --s5: #687786; color-scheme: light; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.mono { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--muted); } .faint { color: var(--faint); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 216px minmax(0, 1fr); grid-template-rows: 52px minmax(0, 1fr); height: 100%; }
.appbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; background: var(--panel); border-bottom: 1px solid var(--line);
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
.logo { display: flex; align-items: center; gap: 9px; font-weight: 700; color: var(--fg-strong); letter-spacing: -.01em; white-space: nowrap; width: 188px; font-size: 14px; }
.wordmark { display: flex; align-items: baseline; gap: 6px; font-size: 15px; font-weight: 700; letter-spacing: -.02em; }
.wordmark b { font: 600 9.5px var(--mono); letter-spacing: .16em; color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent); border-radius: 3px; padding: 1px 4px; transform: translateY(-2px); }
.search { flex: 1; max-width: 520px; position: relative; }
.search input { width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px 6px 30px; }
.search svg { position: absolute; left: 9px; top: 8px; }
.appbar .spacer { flex: 1; }
.envbadge { font: 600 10.5px var(--mono); letter-spacing: .08em; color: var(--amber); border: 1px solid var(--amber); padding: 2px 7px; border-radius: 4px; white-space: nowrap; }
.iconbtn { position: relative; background: none; border: 1px solid transparent; border-radius: 6px; padding: 5px; cursor: pointer; color: var(--muted); display: inline-flex; }
.iconbtn:hover { background: var(--hover); color: var(--fg); }
.iconbtn .badge { position: absolute; top: -2px; right: -3px; background: var(--crit); color: #fff; font: 600 10px var(--mono); border-radius: 8px; padding: 0 4px; min-width: 15px; text-align: center; }
.user { display: flex; align-items: center; gap: 8px; }
.avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 600; font-size: 11px; flex: none; }
.user select { background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; max-width: 280px; }
.sidenav { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding-block: 10px; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: 8px; }
.navgroup { margin-bottom: 12px; }
.navgroup h6 { margin: 6px 10px 4px; font: 600 10px var(--mono); letter-spacing: .12em; color: var(--faint); text-transform: uppercase; }
.navlink { display: flex; align-items: center; gap: 9px; padding: 6px 10px; border-radius: 5px; color: var(--muted); font-weight: 500; }
.navlink:hover { background: var(--hover); color: var(--fg); text-decoration: none; }
.navlink.on { background: var(--accent-soft); color: var(--fg-strong); }
.navlink.on svg { color: var(--accent); }
.navlink .cnt { margin-left: auto; font: 600 10.5px var(--mono); background: var(--crit); color: #fff; border-radius: 8px; padding: 0 5px; }
.content { overflow-y: auto; min-width: 0; padding-block: 16px 28px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
.statusbar { grid-column: 1 / -1; display: flex; gap: 18px; align-items: center; background: var(--panel); border-top: 1px solid var(--line); font: 11px var(--mono); color: var(--muted); overflow: hidden; white-space: nowrap;
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); }
.led { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-right: 6px; vertical-align: 0; box-shadow: 0 0 0 3px var(--ok-bg); }
.led.warn { background: var(--amber); box-shadow: 0 0 0 3px var(--med-bg); } .led.bad { background: var(--crit); box-shadow: 0 0 0 3px var(--crit-bg); }

/* ---------- page ---------- */
.pagehead { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.crumbs { font-size: 11.5px; color: var(--muted); margin-bottom: 3px; } .crumbs a { color: var(--muted); }
.pagehead h1 { margin: 0; font-size: 20px; font-weight: 600; color: var(--fg-strong); letter-spacing: -.01em; text-wrap: balance; }
.pagehead .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; max-width: 80ch; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 6px; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 5px; padding: 5px 11px; cursor: pointer; font-weight: 500; white-space: nowrap; color: var(--fg); }
.btn:hover { background: var(--hover); text-decoration: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 55%, transparent); }
.btn.sm { padding: 3px 8px; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.stack { display: grid; gap: 12px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.g { display: grid; gap: 12px; }
.g-3-1 { grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr); }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-1-1-1 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-side { grid-template-columns: minmax(0, 1fr) 320px; align-items: start; }
.g-left { grid-template-columns: 230px minmax(0, 1fr); align-items: start; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; min-width: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.card-h h2 { margin: 0; font-size: 12.5px; font-weight: 600; color: var(--fg-strong); letter-spacing: .01em; }
.card-h .meta { font: 11px var(--mono); color: var(--muted); }
.card-b { padding: 12px; min-width: 0; }
.card-b.flush { padding: 0; }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.kpis.k4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: grid; gap: 2px; position: relative; overflow: hidden; }
.kpi .lbl { font-size: 11px; color: var(--muted); font-weight: 500; }
.kpi .val { font: 600 28px/1.15 var(--font); color: var(--fg-strong); font-variant-numeric: tabular-nums; }
.kpi .val small { font-size: 13px; color: var(--muted); font-weight: 500; }
.kpi .foot { font-size: 11px; color: var(--muted); display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.kpi.alert { box-shadow: inset 3px 0 0 var(--crit); } .kpi.alert .val { color: var(--crit); }
.kpi.warn { box-shadow: inset 3px 0 0 var(--amber); }

/* tables */
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font: 600 10.5px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 7px 10px; border-bottom: 1px solid var(--line); background: var(--panel-2); white-space: nowrap; position: sticky; top: 0; }
th[data-act] { cursor: pointer; user-select: none; } th[data-act]:hover { color: var(--fg); }
td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--hover); }
tr.sel td { background: var(--accent-soft); }
td.sevcell { box-shadow: inset 3px 0 0 var(--info); }
td.sevcell.critical { box-shadow: inset 3px 0 0 var(--crit); } td.sevcell.high { box-shadow: inset 3px 0 0 var(--high); } td.sevcell.medium { box-shadow: inset 3px 0 0 var(--med); } td.sevcell.low { box-shadow: inset 3px 0 0 var(--low); }

/* pills */
.sev { display: inline-flex; align-items: center; gap: 5px; font: 600 10.5px var(--mono); text-transform: uppercase; letter-spacing: .04em; padding: 1px 7px; border-radius: 3px; white-space: nowrap; }
.sev::before { content: ""; width: 6px; height: 6px; border-radius: 1px; background: currentColor; }
.sev.critical { color: var(--crit); background: var(--crit-bg); } .sev.high { color: var(--high); background: var(--high-bg); } .sev.medium { color: var(--med); background: var(--med-bg); }
.sev.low { color: var(--low); background: var(--low-bg); } .sev.info { color: var(--info); background: var(--info-bg); }
.st { display: inline-block; font-size: 11.5px; font-weight: 500; padding: 1px 8px; border-radius: 10px; border: 1px solid var(--line-2); color: var(--fg); white-space: nowrap; background: var(--panel-2); }
.st.new { border-color: var(--crit); color: var(--crit); } .st.awaiting_oem, .st.open { border-color: var(--amber); color: var(--amber); }
.st.resolved, .st.closed, .st.completed { border-color: var(--ok); color: var(--ok); } .st.duplicate { color: var(--muted); }
.tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 3px; background: var(--panel-2); border: 1px solid var(--line); margin: 1px 3px 1px 0; white-space: nowrap; color: var(--fg); }
.tag.cyber { color: var(--s4); } .tag.physical { color: var(--s2); } .tag.context { color: var(--ok); } .tag.supply_chain { color: var(--s1); }
.tech { font: 500 11px var(--mono); color: var(--s4); border: 1px solid color-mix(in srgb, var(--s4) 40%, transparent); border-radius: 3px; padding: 0 5px; white-space: nowrap; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.dot.off { background: var(--crit); } .dot.warn { background: var(--amber); }

/* misc components */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 12px; overflow-x: auto; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; color: var(--muted); cursor: pointer; font-weight: 500; white-space: nowrap; }
.tabs button:hover { color: var(--fg); }
.tabs button.on { color: var(--fg-strong); border-bottom-color: var(--accent); }
.tabs .cnt { font: 500 10.5px var(--mono); color: var(--muted); margin-left: 4px; }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0; border-top: 1px solid var(--line); }
.fact { padding: 9px 12px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-width: 0; }
.fact span { display: block; font: 600 10px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--faint); margin-bottom: 2px; }
.fact b { font-weight: 500; color: var(--fg-strong); overflow-wrap: anywhere; }
.hyp { display: grid; grid-template-columns: minmax(140px, 1fr) minmax(80px, 1.4fr) 40px; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px dashed var(--line); }
.hyp:last-child { border-bottom: 0; }
.bar { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--s5); border-radius: 3px; }
.hyp.top .bar i { background: var(--amber); } .hyp.top > span:first-child { color: var(--fg-strong); font-weight: 600; }
.hyp small { grid-column: 1 / -1; color: var(--muted); font-size: 11.5px; margin-top: -4px; }
.callout { border: 1px solid var(--line-2); border-left: 3px solid var(--amber); background: var(--panel-2); border-radius: 4px; padding: 8px 10px; font-size: 12.5px; }
.callout.info { border-left-color: var(--accent); }
.note { color: var(--muted); font-size: 12px; }
.empty { padding: 22px 12px; text-align: center; color: var(--muted); font-size: 12.5px; }
.feed { display: grid; }
.fi { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.fi:last-child { border-bottom: 0; }
.fi .t { font: 11px var(--mono); color: var(--muted); padding-top: 1px; }
.fi .h { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 2px; }
.fi b { color: var(--fg-strong); font-weight: 600; }
.fi .x { color: var(--muted); font-size: 12px; }
.fi.selectable { grid-template-columns: 18px 62px minmax(0, 1fr); cursor: pointer; }
.fi.selectable:hover { background: var(--hover); }
.instlist { display: grid; }
.inst { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 9px; align-items: center; padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.inst:hover { background: var(--hover); } .inst.on { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
.inst b { display: block; color: var(--fg-strong); font-weight: 600; } .inst span { color: var(--muted); font-size: 11.5px; }
.assetmap { display: grid; grid-template-columns: 92px repeat(5, minmax(0, 1fr)); gap: 4px; font-size: 11px; }
.assetmap .hd { font: 600 10px var(--mono); color: var(--faint); text-transform: uppercase; letter-spacing: .06em; text-align: center; padding-bottom: 2px; }
.assetmap .rl { font: 500 11.5px var(--mono); color: var(--muted); display: flex; align-items: center; }
.cell { height: 30px; border-radius: 3px; background: var(--ok-bg); border: 1px solid color-mix(in srgb, var(--ok) 35%, transparent); display: grid; place-items: center; font: 500 10.5px var(--mono); color: var(--ok); cursor: default; }
.cell.inc { background: var(--high-bg); border-color: color-mix(in srgb, var(--high) 55%, transparent); color: var(--high); }
.cell.crit { background: var(--crit-bg); border-color: var(--crit); color: var(--crit); }
.cell.off { background: var(--panel-2); border: 1px dashed var(--crit); color: var(--crit); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); align-items: center; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 5px; }
.legend i.line { height: 3px; width: 14px; vertical-align: 2px; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 10px var(--mono); }
.sevbar { display: flex; height: 10px; border-radius: 3px; overflow: hidden; background: var(--panel-2); }
.sevbar i { display: block; height: 100%; }
.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.steps li:last-child { border-bottom: 0; }
.steps li::before { content: counter(s); font: 600 11px var(--mono); color: var(--accent); background: var(--accent-soft); border-radius: 50%; width: 20px; height: 20px; display: grid; place-items: center; }
.steps .btn { margin-top: 5px; }
select, input[type=text], input[type=number], input[type=search], textarea { background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 5px; padding: 5px 8px; min-width: 0; }
textarea { width: 100%; resize: vertical; }
label.fl { display: block; font: 600 10px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--faint); margin: 10px 0 4px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line-2); background: var(--panel-2); border-radius: 12px; padding: 2px 10px; font-size: 12px; cursor: pointer; color: var(--muted); }
.chip.on { border-color: var(--accent); color: var(--fg-strong); background: var(--accent-soft); }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(36px + env(safe-area-inset-bottom, 0px)); background: var(--fg-strong); color: var(--bg); padding: 8px 14px; border-radius: 5px; font-weight: 500; z-index: 40; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgb(0 0 0 / .3); }
.modal { position: fixed; inset: 0; background: rgb(0 0 0 / .55); display: grid; place-items: center; z-index: 30; padding: 16px; }
.modal .card { width: min(920px, 100%); max-height: 86vh; display: flex; flex-direction: column; }
.modal .card-b { overflow: auto; }
pre { white-space: pre-wrap; word-break: break-word; font: 11.5px/1.5 var(--mono); margin: 0; }
.ok { color: var(--ok); } .bad { color: var(--crit); }
.kv { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 6px 10px; font-size: 12.5px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; color: var(--fg-strong); overflow-wrap: anywhere; }
.rail .card + .card { margin-top: 12px; }
@media (max-width: 1200px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g-side { grid-template-columns: 1fr; } }
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; grid-template-rows: auto auto minmax(0, 1fr); height: auto; min-height: 100%; }
  .appbar { flex-wrap: wrap; padding-block: 8px; } .logo { width: auto; } .search { order: 5; flex-basis: 100%; max-width: none; }
  .sidenav { border-right: 0; border-bottom: 1px solid var(--line); display: flex; overflow-x: auto; gap: 4px; padding-block: 6px; }
  .navgroup { display: flex; margin: 0; } .navgroup h6 { display: none; }
  .content { overflow: visible; }
  .g-3-1, .g-2, .g-1-1-1, .g-left { grid-template-columns: 1fr; }

</div>

<script>
(() => {
"use strict";
// ================================================================== transport
let MODE = "server", TOKEN = null, ME = null, USERS = [], ORGS = [];
const S = { inst: "inst-001", incident: null, tab: "summary", stab: "vulns", evSel: new Set(), confirmReset: false, q: "",
  sort: {}, fSev: "all", fStatus: "open", lastOverview: null };
async function detectMode() {
  if (globalThis.EnergyOSEngine) return "local";
  try {
    const r = await fetch("api/users", { cache: "no-store" });
    if (r.ok && (r.headers.get("content-type") || "").includes("json")) return "server";
  } catch (e) {}
  await new Promise((res, rej) => { const s = document.createElement("script"); s.src = "engine.js"; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  return "local";
}
async function api(method, path, body, query) {
  let status, data;
  if (MODE === "local") {
    ({ status, data } = await EnergyOSEngine.request(method, path, query || {}, body || {}, TOKEN));
  } else {
    const qs = query ? "?" + new URLSearchParams(query) : "";
    const r = await fetch(path.slice(1) + qs, { method, headers: { "Content-Type": "application/json", ...(TOKEN ? { Authorization: "Bearer " + TOKEN } : {}) },
      body: method === "POST" ? JSON.stringify(body || {}) : undefined });
    status = r.status; data = await r.json();
  }
  if (status >= 400) throw new Error(data.error || "Request failed (" + status + ")");
  return data;
}
const GET = (p, q) => api("GET", p, null, q), POST = (p, b) => api("POST", p, b);

// ================================================================== helpers
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sev = (s) => `<span class="sev ${esc(s)}">${esc(s)}</span>`;
const st = (s) => `<span class="st ${esc(s)}">${pretty(s)}</span>`;
const kw = (w) => (w == null ? "—" : (w / 1000).toFixed(2) + " kW");
const hms = (ts) => esc(String(ts || "").slice(11, 19));
const can = (perm) => ME && ME.permissions.includes(perm);
const pretty = (s) => esc(String(s || "").replace(/_/g, " "));
const SEVS = ["critical", "high", "medium", "low", "info"];
const KIND = { gateway: "HEMS gateway", meter: "Smart meter", charger: "EV charger (V2H)", inverter: "Solar inverter", battery: "Home battery" };
// Analyst reference mapping to MITRE ATT&CK (ICS unless noted). Indicative only, not a classification.
const TECH = {
  AUTH_BRUTE_FORCE: ["T1110", "Brute Force (Enterprise)"], AUTH_SUCCESS_AFTER_FAILURES: ["T0859", "Valid Accounts"],
  UNRECOGNISED_CLIENT: ["T0859", "Valid Accounts"], UNEXPECTED_V2H_DISCHARGE: ["T0855", "Unauthorized Command Message"],
  GATEWAY_BYPASS: ["T0855", "Unauthorized Command Message"], METER_CHARGER_MISMATCH: ["T0832", "Manipulation of View"],
  SENSITIVE_API_PROBE: ["T0888", "Remote System Information Discovery"], POWER_STEP_CHANGE: ["T0831", "Manipulation of Control"],
};
const tech = (rule) => { const r = String(rule || "").split(" ")[0]; return TECH[r] ? `<span class="tech" title="${esc(TECH[r][1])}">${TECH[r][0]}</span>` : ""; };
const initials = (n) => n.split(" ").map((x) => x[0]).join("").slice(0, 2);
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), 2600); }
function sortRows(id, rows, def) {
  const s = S.sort[id] || def; if (!s) return rows;
  const dir = s.dir === "asc" ? 1 : -1;
  const key = (r) => (s.key === "severity" ? -SEVS.indexOf(r.severity) : r[s.key] ?? "");
  return [...rows].sort((a, b) => (key(a) > key(b) ? dir : key(a) < key(b) ? -dir : 0));
}
function th(id, key, label, def) {
  const s = S.sort[id] || def || {};
  const arrow = s.key === key ? (s.dir === "asc" ? " ▲" : " ▼") : "";
  return `<th data-act="sort" data-t="${id}" data-k="${key}" aria-sort="${s.key === key ? (s.dir === "asc" ? "ascending" : "descending") : "none"}">${esc(label)}${arrow}</th>`;
}
const card = (title, body, { meta = "", flush = false, actions = "" } = {}) =>
  `<section class="card"><div class="card-h"><h2>${title}</h2><div class="row">${meta ? `<span class="meta">${meta}</span>` : ""}${actions}</div></div><div class="card-b ${flush ? "flush" : ""}">${body}</div></section>`;
const empty = (msg) => `<div class="empty">${msg}</div>`;

// ---------------- charts (SVG, theme-token coloured)
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw || 1))); const n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
function lineChart(rows, keys, { height = 230, unit = "kW", scale = 1000 } = {}) {
  const W = 800, H = height, L = 50, R = 14, T = 12, B = 22;
  const vals = rows.flatMap((r) => keys.map((k) => r[k.key])).filter((v) => v != null && isFinite(v)).map((v) => v / scale);
  if (!vals.length) return empty("Waiting for telemetry…");
  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals); if (hi - lo < 1e-6) hi = lo + 1;
  const step = niceStep((hi - lo) / 4); lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const x = (i) => L + (rows.length <= 1 ? 0 : (i / (rows.length - 1)) * (W - L - R));
  const y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  let g = "";
  for (let v = lo; v <= hi + 1e-9; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line);stroke-width:${Math.abs(v) < 1e-9 ? 1.4 : 1}px"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${+v.toFixed(2)} ${unit}</text>`;
  const idx = [...new Set([0, Math.floor((rows.length - 1) / 4), Math.floor((rows.length - 1) / 2), Math.floor((3 * (rows.length - 1)) / 4), rows.length - 1])];
  g += idx.map((i) => `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === rows.length - 1 ? "end" : "middle"}">${esc(rows[i].ts)}</text>`).join("");
  const paths = keys.map((k) => {
    let d = "", pen = false, last = null, first = null;
    rows.forEach((r, i) => { const v = r[k.key]; if (v == null) { pen = false; return; } const px = x(i).toFixed(1), py = y(v / scale).toFixed(1); d += (pen ? "L" : "M") + px + " " + py; pen = true; last = [px, py]; if (!first) first = px; });
    const area = k.area && last ? `<path d="${d}L${last[0]} ${y(0)}L${first} ${y(0)}Z" style="fill:${k.color};opacity:.10"/>` : "";
    return area + `<path d="${d}" style="fill:none;stroke:${k.color};stroke-width:${k.width || 1.6}px;stroke-linejoin:round${k.dash ? `;stroke-dasharray:${k.dash}` : ""}"/>` +
      (last ? `<circle cx="${last[0]}" cy="${last[1]}" r="3" style="fill:${k.color}"/>` : "");
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(keys.map((k) => k.label).join(", "))}">${g}${paths}</svg>
    <div class="legend" style="margin-top:6px">${keys.map((k) => `<span><i class="line" style="background:${k.color}"></i>${esc(k.label)}</span>`).join("")}</div>`;
}
function barChart(rows) {
  if (!rows.length) return empty("No findings yet. Start a scenario from the Simulation lab.");
  const W = 800, H = 190, L = 34, B = 22, T = 10, slots = Math.max(rows.length, 20);
  const max = Math.max(1, ...rows.map((r) => r.cyber + r.physical));
  const step = niceStep(max / 3), top = Math.ceil(max / step) * step;
  const bw = (W - L - 6) / slots, y = (v) => T + (1 - v / top) * (H - T - B);
  let s = "";
  for (let v = 0; v <= top; v += step) s += `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${v}</text>`;
  rows.forEach((r, i) => {
    const x0 = L + i * bw + 2, w = Math.max(2, bw - 4);
    s += `<rect x="${x0}" y="${y(r.physical)}" width="${w}" height="${y(0) - y(r.physical)}" rx="1" style="fill:var(--s2)"><title>${esc(r.time)} · physical ${r.physical}</title></rect>`;
    s += `<rect x="${x0}" y="${y(r.physical + r.cyber)}" width="${w}" height="${y(r.physical) - y(r.physical + r.cyber)}" rx="1" style="fill:var(--s4)"><title>${esc(r.time)} · cyber ${r.cyber}</title></rect>`;
    if (i === 0 || i === rows.length - 1 || i % 5 === 0) s += `<text x="${x0 + w / 2}" y="${H - 6}" text-anchor="middle">${esc(r.time)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Findings per 30 seconds">${s}</svg>
    <div class="legend" style="margin-top:6px"><span><i style="background:var(--s4)"></i>Cyber findings</span><span><i style="background:var(--s2)"></i>Physical findings</span><span class="faint">30 s buckets</span></div>`;
}
function spark(vals, color = "var(--accent)") {
  const v = vals.filter((x) => x != null); if (v.length < 2) return "";
  const W = 90, H = 24, lo = Math.min(...v), hi = Math.max(...v), r = hi - lo || 1;
  const pts = v.map((x, i) => `${(i / (v.length - 1)) * W},${H - 2 - ((x - lo) / r) * (H - 4)}`).join(" ");
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${pts}" style="fill:none;stroke:${color};stroke-width:1.5px"/></svg>`;
}

// ================================================================== navigation
const ICONS = {
  overview: '<rect x="2" y="2" width="6" height="6" rx="1"/><rect x="10" y="2" width="6" height="6" rx="1"/><rect x="2" y="10" width="6" height="6" rx="1"/><rect x="10" y="10" width="6" height="6" rx="1"/>',
  live: '<path d="M1 9h3l2-5 3 10 2-6 2 3h4"/>',
  correlation: '<circle cx="4" cy="4" r="2"/><circle cx="14" cy="4" r="2"/><circle cx="9" cy="14" r="2"/><path d="M5.5 5.5 8 12.5M12.5 5.5 10 12.5M6 4h6"/>',
  incidents: '<path d="M9 2 1.5 15h15z"/><path d="M9 7v4M9 13v.5"/>',
  coordination: '<circle cx="5" cy="6" r="2.5"/><circle cx="13" cy="6" r="2.5"/><path d="M1 15c0-2.5 2-4 4-4s4 1.5 4 4M9 15c0-2.5 2-4 4-4s4 1.5 4 4"/>',
  supply: '<path d="M2 5l7-3 7 3-7 3zM2 5v8l7 3 7-3V5M9 8v8"/>',
  fleet: '<rect x="2" y="3" width="14" height="9" rx="1"/><path d="M6 15h6M9 12v3"/>',
  simulation: '<path d="M6 2h6M7 2v5l-4 8h12l-4-8V2"/>',
  audit: '<path d="M4 2h7l3 3v11H4z"/><path d="M7 8h5M7 11h5M7 14h3"/>',
};
const VIEWS = {
  overview: { title: "Overview", nav: true, perm: null, render: renderOverview },
  live: { title: "Monitoring", nav: true, perm: "view_fleet", render: renderLive },
  incidents: { title: "Incidents", nav: true, perm: ["view_incidents_all", "view_shared"], render: renderIncidents },
  supply: { title: "Supply chain", nav: true, perm: ["view_fleet", "vex"], render: renderSupply },
  coordination: { title: "Tasks", nav: true, perm: ["view_incidents_all", "task_respond"], render: renderCoordination },
  simulation: { title: "Demo lab", nav: true, perm: "simulate", render: renderSimulation },
  audit: { title: "Audit log", nav: true, perm: "audit", render: renderAudit },
  search: { title: "Search", nav: false, perm: null, render: renderSearch },
};
const allowed = (v) => !v.perm || [].concat(v.perm).some(can);
function currentView() {
  const h = location.hash.slice(1);
  if (h.startsWith("incident-")) { const id = +h.slice(9); if (S.incident !== id) { S.incident = id; S.tab = "summary"; } return "incidents"; }
  S.incident = null;
  return VIEWS[h] && allowed(VIEWS[h]) ? h : "overview";
}
let navCounts = {};
function renderNav(active) {
  document.getElementById("nav").innerHTML = `<div class="navgroup">${Object.entries(VIEWS).filter(([, v]) => v.nav && allowed(v)).map(([k, v]) =>
    `<a href="#${k}" class="navlink ${k === active ? "on" : ""}" ${k === active ? 'aria-current="page"' : ""}><svg width="16" height="16" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">${ICONS[k]}</svg>${esc(v.title)}${navCounts[k] ? `<span class="cnt">${navCounts[k]}</span>` : ""}</a>`).join("")}</div>`;
}
const head = (title, sub, actions = "", crumbs = "") => `<div class="pagehead"><div>${crumbs ? `<div class="crumbs">${crumbs}</div>` : ""}<h1>${title}</h1>${sub ? `<div class="sub">${sub}</div>` : ""}</div><div class="actions">${actions}</div></div>`;

// ================================================================== views
async function renderOverview() {
  const o = await GET("/api/overview");
  S.lastOverview = o;
  const canInc = can("view_incidents_all") || can("view_shared");
  const incs = canInc ? (await GET("/api/incidents")).filter((i) => !["resolved", "closed", "duplicate"].includes(i.status)) : [];
  const fleet = can("view_fleet") ? await GET("/api/fleet") : null;
  const groups = can("view_incidents_all") ? await GET("/api/correlations") : [];
  const critHigh = (o.by_severity.critical || 0) + (o.by_severity.high || 0);
  const devInc = {};
  groups.filter((g) => g.promoted).forEach((g) => g.devices.forEach((d) => { if (!devInc[d] || SEVS.indexOf(g.severity) < SEVS.indexOf(devInc[d])) devInc[d] = g.severity; }));
  let map = "";
  if (fleet) {
    const insts = [...new Set(fleet.devices.map((d) => d.installation))].sort();
    const kinds = ["gateway", "meter", "charger", "inverter", "battery"];
    map = `<div class="assetmap"><div></div>${kinds.map((k) => `<div class="hd">${esc(k)}</div>`).join("")}
      ${insts.map((i) => `<div class="rl">${esc(i)}</div>${kinds.map((k) => { const d = fleet.devices.find((x) => x.installation === i && x.kind === k);
        const s = devInc[d.id]; const cls = !d.online ? "off" : s === "critical" ? "crit" : s ? "inc" : "";
        return `<div class="cell ${cls}" title="${esc(d.id)} · ${esc(d.vendor)} ${esc(d.model)} fw ${esc(d.firmware)}${s ? " · in " + s + " incident" : ""}${!d.online ? " · OFFLINE" : ""}">${esc(d.firmware)}</div>`; }).join("")}`).join("")}</div>
      <div class="legend" style="margin-top:10px"><span><i style="background:var(--ok)"></i>Healthy</span><span><i style="background:var(--high)"></i>In an incident</span><span><i style="background:var(--crit)"></i>Critical</span><span><i style="border:1px dashed var(--crit)"></i>Offline</span><span class="faint">label = firmware</span></div>`;
  }
  return `${head("Overview", "HomeGrid's homes and devices from five vendors, monitored by Aegis Grid Security Operations.",
      can("simulate") ? `<button class="btn primary" data-act="demo-run">Run attack demo</button>` : "")}
  <div class="stack">
    <div class="kpis k4">
      <div class="kpi ${o.active_incidents ? "alert" : ""}"><span class="lbl">Active incidents</span><span class="val">${o.active_incidents}</span><span class="foot">${critHigh} critical or high</span></div>
      <div class="kpi ${o.awaiting_review ? "warn" : ""}"><span class="lbl">Awaiting review</span><span class="val">${o.awaiting_review}</span><span class="foot">${o.awaiting_oem} waiting on a vendor</span></div>
      <div class="kpi"><span class="lbl">Devices online</span><span class="val">${o.devices_online}<small>/${o.devices}</small></span><span class="foot">${o.installations} homes · ${o.vendors} vendors</span></div>
      <div class="kpi ${o.exposed_devices ? "warn" : ""}"><span class="lbl">Exposed devices</span><span class="val">${o.exposed_devices}</span><span class="foot">on vulnerable firmware</span></div>
    </div>
    ${canInc || fleet ? `<div class="g g-2">
      ${canInc ? card("Open incidents", incs.length ? `<div class="tw"><table><tbody>
        ${incs.slice(0, 6).map((i) => `<tr class="click" data-act="open-inc" data-id="${i.id}"><td class="sevcell ${esc(i.severity)}">${sev(i.severity)}</td><td><div style="color:var(--fg-strong);font-weight:500">${esc(i.title)}</div><div class="faint mono">${esc(i.code)} · ${pretty(i.status)}</div></td></tr>`).join("")}</tbody></table></div>` : empty("No open incidents. Run the attack demo to create one."),
        { flush: true, actions: `<a class="btn sm" href="#incidents">View all</a>` }) : ""}
      ${fleet ? card("Device map", map, { meta: "home × device" }) : ""}
    </div>` : card("Findings over time", barChart(o.trend), { meta: "last 10 min" })}
    ${can("simulate") ? card("Demo in five steps", `<ol class="steps">
        <li><div>Start the attack: an unknown client breaks into the home gateway and orders the car charger to discharge. <button class="btn sm primary" data-act="demo-run">Run attack demo</button></div></li>
        <li><div>Open the incident it creates. In <b>Evidence</b>, tick two findings; in <b>Coordination</b>, assign a task to VoltCharge. <button class="btn sm" data-act="demo-open">Open latest incident</button></div></li>
        <li><div>Switch to <b>Andy</b> at VoltCharge: only the ticked findings are visible. <button class="btn sm" data-act="as" data-user="u-voltcharge">Switch to Andy</button></div></li>
        <li><div>Switch back to <b>May</b>: confirm the attack, then resolve and close. <button class="btn sm" data-act="as" data-user="u-analyst">Switch to May</button></div></li>
        <li><div>Open the <a href="#audit">Audit log</a>: every step is recorded and verified.</div></li></ol>`, { flush: true }) : ""}
  </div>`;
}

async function renderLive() {
  const d = await GET("/api/live", { installation: S.inst });
  const metric = (x) => x.kind === "meter" ? `grid ${kw(x.last.grid_power_w)} · EV circuit ${kw(x.last.ev_circuit_power_w)}`
    : x.kind === "gateway" ? `CPU ${x.last.cpu_pct ?? "—"}% · ${x.last.connected_devices ?? "—"} devices`
    : `${kw(x.last.active_power_w)}${x.last.soc_pct != null ? ` · SOC ${x.last.soc_pct}%` : x.last.soc_estimate_pct != null ? ` · EV SOC est. ${x.last.soc_estimate_pct}%` : ""}`;
  return `${head("Monitoring", "Telemetry and cyber events as ingested. Power sign: positive draws from the home bus, negative injects (discharge, PV).")}
  <div class="g g-left">
    ${card("Installations", `<div class="instlist">${d.installations.map((i) => `<div class="inst ${i.id === S.inst ? "on" : ""}" data-act="inst" data-id="${esc(i.id)}" role="button" tabindex="0"><span class="dot"></span><div><b>${esc(i.id)}</b><span>${esc(i.name)} · charger fw ${esc(i.charger_fw)}</span></div></div>`).join("")}</div>`, { flush: true })}
    <div class="stack">
      ${card(`Devices · ${esc(S.inst)}`, `<div class="tw"><table><thead><tr><th>Device</th><th>Type</th><th>Vendor / model</th><th>Firmware</th><th>State</th><th>Reading</th></tr></thead><tbody>
        ${d.devices.map((x) => `<tr><td class="mono"><span class="dot ${x.online ? "" : "off"}"></span> ${esc(x.id)}</td><td>${esc(KIND[x.kind])}</td><td>${esc(x.vendor)}<div class="muted">${esc(x.model)}</div></td><td class="mono">${esc(x.firmware)}</td>
          <td>${x.online ? `<span class="st">${esc(x.state)}</span>` : `<span class="st new">offline</span>`}</td><td class="mono num">${esc(metric(x))}</td></tr>`).join("")}</tbody></table></div>`, { flush: true })}
      ${card("Power flow", lineChart(d.series, [
        { key: "charger_reported_w", label: "EV charger (device-reported)", color: "var(--s1)", width: 2.2, area: true },
        { key: "meter_ev_circuit_w", label: "Meter EV circuit (independent)", color: "var(--s2)", dash: "5 4", width: 1.8 },
        { key: "battery_w", label: "Battery", color: "var(--s3)" }, { key: "pv_w", label: "Solar PV", color: "var(--s4)" },
        { key: "grid_w", label: "Grid import", color: "var(--s5)" }]), { meta: "last 120 s · 1 Hz" })}

function findingRow(x) {

function hypotheses(h) {
  return h.map((x, i) => `<div class="hyp ${i === 0 ? "top" : ""}"><span>${esc(x.label)}</span><div class="bar"><i style="width:${Math.round(x.support * 100)}%"></i></div><span class="mono num">${Math.round(x.support * 100)}%</span>

async function renderIncidents() {
  if (S.incident) return renderIncident(S.incident);
  const all = await GET("/api/incidents");
  const open = (i) => !["resolved", "closed", "duplicate"].includes(i.status);
  let rows = all.filter((i) => (S.fStatus === "all" || (S.fStatus === "open" ? open(i) : !open(i))) && (S.fSev === "all" || i.severity === S.fSev));
  rows = sortRows("inc", rows, { key: "id", dir: "desc" });
  const chip = (k, v, label) => `<button class="chip ${S[k] === v ? "on" : ""}" data-act="filter" data-f="${k}" data-v="${v}">${label}</button>`;
  return `${head("Incidents", can("view_shared") ? `Investigations shared with ${esc(ME.org_name)}.` : "Correlated cases awaiting human review. EnergyOS never confirms attacks or acts on devices by itself.")}
  ${card("Queue", `<div class="row" style="padding:10px 12px;border-bottom:1px solid var(--line);justify-content:space-between">
      <div class="chips">${chip("fStatus", "open", "Open")}${chip("fStatus", "done", "Resolved / closed")}${chip("fStatus", "all", "All")}</div>
      <div class="chips">${chip("fSev", "all", "Any severity")}${SEVS.slice(0, 4).map((s) => chip("fSev", s, s[0].toUpperCase() + s.slice(1))).join("")}</div></div>
    ${rows.length ? `<div class="tw"><table><thead><tr>${th("inc", "code", "ID")}${th("inc", "severity", "Severity")}${th("inc", "status", "Status")}<th>Title</th><th>Scope</th><th>Human verdict</th>${th("inc", "last_activity", "Last activity")}</tr></thead><tbody>
    ${rows.map((i) => `<tr class="click" data-act="open-inc" data-id="${i.id}"><td class="mono sevcell ${esc(i.severity)}">${esc(i.code)}</td><td>${sev(i.severity)}</td><td>${st(i.status)}${i.merged_into ? `<div class="faint mono">→ ${esc(i.merged_into)}</div>` : ""}</td>
      <td>${esc(i.title)}</td><td class="mono">${esc(i.installations.join(", ") || "—")}</td><td class="muted">${esc(i.attack_confirmation)}</td><td class="mono">${hms(i.last_activity)}</td></tr>`).join("")}</tbody></table></div>`
    : empty(can("view_shared") ? "Nothing has been shared with your organisation." : "No incidents match these filters.")}`, { flush: true, meta: `${rows.length} of ${all.length}` })}`;

  series.forEach(([k, pts]) => pts.forEach((p) => ((crow[p.ts] = crow[p.ts] || { ts: p.ts })[k] = p.power_w)));
  const chartRows = Object.values(crow).sort((a, b) => (a.ts < b.ts ? -1 : 1));

      ${card("Recommended next steps", `<ol style="margin:0;padding-left:18px;display:grid;gap:4px">${i.recommended.actions.map((a) => `<li>${esc(a)}</li>`).join("")}</ol><div class="note" style="margin-top:8px">${esc(i.recommended.note)}</div>`)}

      <td>${s.components.map((c) => `<span class="tag mono" title="${esc(c.purl || "")}">${esc(c.name)}@${esc(c.version)}</span>`).join("")}</td>
      <td>${s.applicability.map((a) => `<div style="margin-bottom:6px"><span class="mono">${esc(a.vulnerability)}</span> <span class="st ${a.status === "not_affected" ? "closed" : "new"}">${pretty(a.status)}</span><div class="faint" style="font-size:11.5px">${esc(a.method)}</div>
        ${d.can_decide ? `<div class="row" style="margin-top:3px"><button class="btn sm" data-act="vex" data-v="${esc(a.vulnerability)}" data-m="${esc(s.firmware)}" data-ver="${esc(s.version)}" data-s="confirmed_affected">Confirm affected</button><button class="btn sm" data-act="vex" data-v="${esc(a.vulnerability)}" data-m="${esc(s.firmware)}" data-ver="${esc(s.version)}" data-s="not_affected">Not affected</button></div>` : ""}</div>`).join("") || `<span class="faint">No applicable records</span>`}</td></tr>`).join("")}</tbody></table></div>`, { flush: true });
  if (S.stab === "assets") { const f = await GET("/api/fleet"); const rows = sortRows("fleet", f.devices, { key: "installation", dir: "asc" });
    body = card("Devices", `<div class="tw"><table><thead><tr>${th("fleet", "installation", "Home")}${th("fleet", "id", "Device")}${th("fleet", "kind", "Type")}${th("fleet", "vendor", "Vendor")}${th("fleet", "model", "Model")}${th("fleet", "firmware", "Firmware")}<th>Status</th></tr></thead><tbody>
      ${rows.map((x) => `<tr><td class="mono">${esc(x.installation)}</td><td class="mono">${esc(x.id)}</td><td>${esc(KIND[x.kind])}</td><td>${esc(x.vendor)}</td><td>${esc(x.model)}</td><td class="mono">${esc(x.firmware)}</td><td><span class="dot ${x.online ? "" : "off"}"></span> ${x.online ? "Online" : "Offline"}</td></tr>`).join("")}</tbody></table></div>`, { flush: true, meta: can("view_fleet") ? `${f.devices.length} devices` : "your products only; homes withheld" }); }
  if (S.stab === "upload") body = d.can_decide || can("triage") ? card("Ingest a CycloneDX SBOM", `<div class="stack" style="gap:8px;max-width:720px"><input type="file" id="sbom-file" accept=".json,application/json" aria-label="SBOM file">
    <textarea id="sbom-text" rows="6" class="mono" placeholder='…or paste CycloneDX JSON: {"bomFormat":"CycloneDX","specVersion":"1.5", …}'></textarea>
    <div class="row"><button class="btn primary" data-act="sbom">Parse and ingest</button><span class="note">Validated as CycloneDX, size-limited, components matched against known vulnerabilities.</span></div></div>`) : card("Ingest", empty("Your role cannot ingest SBOMs."));
  return `${head("Supply chain", "Which devices run software with known vulnerabilities. Matching gives “potentially affected”; only the manufacturer confirms impact. HYPO-* records are hypothetical.")}
  <div class="tabs">${tabs.map(([k, l, n]) => `<button class="${S.stab === k ? "on" : ""}" data-act="stab" data-tab="${k}">${l}${n != null ? `<span class="cnt">${n}</span>` : ""}</button>`).join("")}</div>${body}`;
}

async function renderSimulation() {
  const d = await GET("/api/scenarios");
  return `${head("Demo lab", "Each scenario only changes how simulated devices behave. The platform works out what happened on its own, and each run is scored against the expected result.",
    S.confirmReset ? `<span class="muted">Clear all incidents, tasks and history?</span><button class="btn danger" data-act="reset-yes">Reset</button><button class="btn" data-act="reset-no">Cancel</button>` : `<button class="btn" data-act="reset">Reset platform</button>`)}
  <div class="stack">
  ${card("Scenario catalogue", `<div class="tw"><table><thead><tr><th>Scenario</th><th>Behaviour injected</th><th>Expected outcome</th><th>Duration</th><th></th></tr></thead><tbody>
    ${d.scenarios.map((s) => `<tr><td><b>${esc(s.name)}</b><div class="faint mono">${esc(s.key)}</div></td><td>${esc(s.description)}</td><td class="muted">${esc(s.expected)}</td><td class="mono">${s.duration} s</td><td><button class="btn sm primary" data-act="run" data-k="${esc(s.key)}">Run</button></td></tr>`).join("")}</tbody></table></div>`, { flush: true })}
  ${card("Runs: expected vs actual", `<div class="tw"><table><thead><tr><th>Run</th><th>Scenario</th><th>Status</th><th>Time to first finding</th><th>Rules fired</th><th>Incidents</th><th>Top hypothesis</th><th>Ground truth</th></tr></thead><tbody>
    ${d.runs.map((r) => `<tr><td class="mono">#${r.id}</td><td>${esc(r.name)}</td><td>${st(r.status)}</td><td class="mono">${r.first_detection_s != null ? "+" + r.first_detection_s + " s" : "—"}</td>
      <td>${[...new Set(r.detections.map((x) => x.rule))].map((x) => `<span class="tag mono">${esc(x)}</span>`).join("") || "—"}</td>
      <td>${r.incidents.map((c) => `<a class="mono" href="#incident-${+c.split("-").pop()}">${esc(c)}</a>`).join(" ") || '<span class="faint">none</span>'}</td>
      <td>${pretty(r.top_hypotheses[0] || "—")}<div class="faint" style="font-size:11.5px">expected: ${pretty(r.ground_truth.expected_hypothesis || "no incident")}</div></td>
      <td class="${r.hypothesis_match ? "ok" : "bad"}">${r.status === "running" ? '<span class="muted">running…</span>' : r.hypothesis_match ? "✓ Match" : "✗ Mismatch"}</td></tr>`).join("") || `<tr><td colspan="8">${empty("No runs yet.")}</td></tr>`}</tbody></table></div>`, { flush: true })}</div>`;
}

async function renderAudit() {
  const a = await GET("/api/audit");
  return `${head("Audit log", "Every human and system action, chained with SHA-256 so any edit to history breaks verification.", `<span class="st ${a.chain_valid ? "closed" : "new"}">${a.chain_valid ? "✓ Hash chain verified" : "✗ Chain broken"}</span>`)}
  ${card("Records", `<div class="tw"><table><thead><tr><th>#</th><th>Time</th><th>Actor</th><th>Action</th><th>Resource</th><th>Details</th><th>Hash</th></tr></thead><tbody>
    ${a.records.map((r) => `<tr><td class="mono">${r.seq}</td><td class="mono">${hms(r.at)}</td><td>${esc(r.actor_name)}</td><td class="mono">${esc(r.action)}</td><td class="mono">${esc(r.resource)}</td><td class="faint mono" style="max-width:360px;font-size:11px">${esc(JSON.stringify(r.details)).slice(0, 160)}</td><td class="mono faint">${esc(String(r.hash || "").slice(0, 12))}</td></tr>`).join("")}</tbody></table></div>`, { flush: true, meta: `${a.records.length} records` })}`;
}

async function renderSearch() {
  const q = S.q.trim().toLowerCase();
  if (!q) return head("Search", "Type in the search bar above.");
  const has = (o) => JSON.stringify(o).toLowerCase().includes(q);
  const incs = (can("view_incidents_all") || can("view_shared")) ? (await GET("/api/incidents")).filter(has) : [];
  const devs = (can("view_fleet") || can("vex")) ? (await GET("/api/fleet")).devices.filter(has) : [];
  const vulns = (can("view_fleet") || can("vex")) ? (await GET("/api/supply-chain")).vulnerabilities.filter(has) : [];
  const groups = can("view_incidents_all") ? (await GET("/api/correlations")).filter(has) : [];
  return `${head(`Results for “${esc(S.q)}”`, `${incs.length + devs.length + vulns.length + groups.length} matches`)}<div class="stack">
    ${card("Incidents", incs.length ? `<table><tbody>${incs.map((i) => `<tr class="click" data-act="open-inc" data-id="${i.id}"><td class="mono">${esc(i.code)}</td><td>${sev(i.severity)}</td><td>${esc(i.title)}</td></tr>`).join("")}</tbody></table>` : empty("None"), { flush: true })}
    ${card("Correlation groups", groups.length ? `<table><tbody>${groups.map((g) => `<tr><td class="mono">Group ${g.id}</td><td>${sev(g.severity)}</td><td>${esc(g.installations.join(", "))}</td><td>${esc((g.hypotheses[0] || {}).label || "")}</td></tr>`).join("")}</tbody></table>` : empty("None"), { flush: true })}
    ${card("Assets", devs.length ? `<table><tbody>${devs.map((d) => `<tr><td class="mono">${esc(d.id)}</td><td>${esc(d.vendor)} ${esc(d.model)}</td><td class="mono">fw ${esc(d.firmware)}</td><td class="mono">${esc(d.installation)}</td></tr>`).join("")}</tbody></table>` : empty("None"), { flush: true })}
    ${card("Vulnerabilities", vulns.length ? `<table><tbody>${vulns.map((v) => `<tr><td class="mono">${esc(v.id)}</td><td>${esc(v.title)}</td></tr>`).join("")}</tbody></table>` : empty("None"), { flush: true })}</div>`;
}

// ================================================================== render loop (preserves form state across refresh)
let rendering = false;
async function render() {
  if (rendering || !ME) return;
  rendering = true;
  const name = currentView(), view = document.getElementById("view");
  try {
    const html = await VIEWS[name].render();
    const saved = {}, activeId = document.activeElement && document.activeElement.id;
    let sel = null;
    view.querySelectorAll("input[id],textarea[id],select[id]").forEach((el) => { if (el.type !== "file") saved[el.id] = el.value; });
    if (activeId && document.activeElement.selectionStart != null) sel = [document.activeElement.selectionStart, document.activeElement.selectionEnd];
    const scroll = view.scrollTop;
    view.innerHTML = html;
    for (const [k, v] of Object.entries(saved)) { const el = document.getElementById(k); if (el && v !== "" && el.closest("#view")) el.value = v; }
    if (activeId && activeId !== "q") { const el = document.getElementById(activeId); if (el) { el.focus({ preventScroll: true }); if (sel && el.setSelectionRange) try { el.setSelectionRange(...sel); } catch (e) {} } }
    view.scrollTop = scroll;
  } catch (e) {
    view.innerHTML = head("Something went wrong", "") + card("Error", `<div class="callout">${esc(e.message)}</div>`);
  }
  renderNav(name);
  try {
    const o = S.lastOverview && name === "overview" ? S.lastOverview : await GET("/api/overview");
    navCounts.incidents = o.awaiting_review || 0;
    const bell = document.getElementById("bell");
    bell.innerHTML = bell.innerHTML.replace(/<span class="badge">.*?<\/span>/, "") + (o.awaiting_review && (can("view_incidents_all") || can("view_shared")) ? `<span class="badge">${o.awaiting_review}</span>` : "");
    bell.hidden = !(can("view_incidents_all") || can("view_shared"));
    document.getElementById("clock").textContent = `SIMULATION · t+${o.sim_time_s}s`;
  } catch (e) {}
  S.lastOverview = null;
  rendering = false;
}

async function signIn(uid) {
  const { token } = await POST("/api/login", { user_id: uid });
  TOKEN = token; ME = await GET("/api/me");
  document.getElementById("identity").value = uid;
  document.getElementById("avatar").textContent = initials(ME.name);
  S.evSel.clear();
  const v = currentView();
  if (location.hash.startsWith("#incident-") && !(can("view_incidents_all") || can("view_shared"))) location.hash = "overview";
  else if (location.hash && !location.hash.startsWith("#incident-") && v !== location.hash.slice(1)) location.hash = "overview";
  await render();
}

document.addEventListener("click", async (ev) => {
  const el = ev.target.closest("[data-act]");
  if (!el || el.tagName === "SELECT" || el.type === "checkbox" || el.tagName === "INPUT") return;
  const a = el.dataset.act, id = el.dataset.id;
  const val = (x) => (document.getElementById(x) || {}).value || "";
  try {
    if (a === "open-inc") { location.hash = "incident-" + id; return; }
    if (a === "inst") { S.inst = id; }
    if (a === "tab") { S.tab = el.dataset.tab; }
    if (a === "stab") { S.stab = el.dataset.tab; }
    if (a === "filter") { S[el.dataset.f] = el.dataset.v; }
    if (a === "sort") { const cur = S.sort[el.dataset.t]; S.sort[el.dataset.t] = { key: el.dataset.k, dir: cur && cur.key === el.dataset.k && cur.dir === "desc" ? "asc" : "desc" }; }
    if (a === "as") { await signIn(el.dataset.user); toast("Signed in as " + ME.name); return; }
    if (a === "demo-run") { if (!can("simulate")) await signIn("u-analyst"); await POST("/api/scenarios/suspicious_v2h/start"); S.inst = "inst-001"; location.hash = "live"; toast("Scenario started: watch inst-001"); return; }
    if (a === "demo-open") { const l = await GET("/api/incidents"); if (!l.length) return toast("No incident yet. Run the scenario first."); location.hash = "incident-" + l[0].id; return; }
    if (a === "run") { await POST(`/api/scenarios/${el.dataset.k}/start`); toast("Scenario started"); }
    if (a === "reset") S.confirmReset = true;
    if (a === "reset-no") S.confirmReset = false;
    if (a === "reset-yes") { await POST("/api/simulation/reset"); S.confirmReset = false; toast("Platform reset"); }
    if (a === "decide") { await POST(`/api/incidents/${id}/decision`, { decision: el.dataset.d, rationale: val("reason") }); document.getElementById("reason").value = ""; toast("Decision recorded"); }
    if (a === "status") { await POST(`/api/incidents/${id}/status`, { status: el.dataset.s, reason: val("reason") }); document.getElementById("reason").value = ""; toast("Status updated"); }
    if (a === "note") { if (!val("note")) return toast("Write a note first"); await POST(`/api/incidents/${id}/notes`, { body: val("note") }); document.getElementById("note").value = ""; toast("Note added"); }
    if (a === "task") { if (!val("task-title")) return toast("Give the task a title"); await POST(`/api/incidents/${id}/tasks`, { org: val("task-org"), title: val("task-title"), due_hours: +val("task-due") || 48, evidence_ids: [...S.evSel] });
      document.getElementById("task-title").value = ""; S.evSel.clear(); toast("Task assigned"); }
    if (a === "share") { await POST(`/api/incidents/${id}/share`, { org: val("task-org"), evidence_ids: [...S.evSel] }); S.evSel.clear(); toast("Evidence shared"); }
    if (a === "task-upd") { const c = val("tc-" + id); if (!el.dataset.s && !c) return toast("Write a reply first"); await POST(`/api/tasks/${id}`, { status: el.dataset.s || null, comment: c }); const i = document.getElementById("tc-" + id); if (i) i.value = ""; toast("Task updated"); }
    if (a === "vex") { await POST("/api/supply-chain/decision", { vulnerability: el.dataset.v, model: el.dataset.m, version: el.dataset.ver, status: el.dataset.s, note: "Vendor product-security assessment" }); toast("Applicability decision recorded"); }
    if (a === "sbom") {
      const f = document.getElementById("sbom-file").files[0], content = f ? await f.text() : val("sbom-text");
      if (!content) return toast("Choose a file or paste JSON");
      const r = await POST("/api/supply-chain/sbom", { content, filename: f ? f.name : "pasted.json" });
      toast(`Ingested ${r.firmware} ${r.version}: ${r.components} components`); S.stab = "sboms";
    }
    if (a === "export") { const data = await GET(`/api/incidents/${id}/export`); showModal("Evidence export (JSON)", JSON.stringify(data, null, 2)); return; }
    if (a === "copy") { const t = document.getElementById("modal-pre").textContent; try { await navigator.clipboard.writeText(t); toast("Copied"); } catch (e) { const r = document.createRange(); r.selectNodeContents(document.getElementById("modal-pre")); getSelection().removeAllRanges(); getSelection().addRange(r); toast("Selected. Press Ctrl/⌘+C."); } return; }
    if (a === "close-modal") { document.getElementById("modal").hidden = true; return; }
    await render();
  } catch (e) { toast(e.message); }
});
document.addEventListener("keydown", (ev) => { if (ev.key === "Enter" && ev.target.dataset && ev.target.dataset.act === "inst") ev.target.click(); if (ev.key === "Escape") document.getElementById("modal").hidden = true; });
document.addEventListener("change", async (ev) => {
  const el = ev.target;
  if (el.id === "identity") return signIn(el.value).catch((e) => toast(e.message));
  if (el.dataset.act === "evsel") { el.checked ? S.evSel.add(el.value) : S.evSel.delete(el.value); const m = document.getElementById("selcount"); if (m) m.textContent = `${S.evSel.size} selected for sharing`; }
});
document.getElementById("searchform").addEventListener("submit", (ev) => { ev.preventDefault(); S.q = document.getElementById("q").value; if (location.hash === "#search") render(); else location.hash = "search"; });
function showModal(title, text) {
  const m = document.getElementById("modal");
  m.innerHTML = card(esc(title), `<pre id="modal-pre">${esc(text)}</pre>`, { actions: `<button class="btn sm" data-act="copy">Copy</button><button class="btn sm" data-act="close-modal">Close</button>` });
  m.hidden = false;
}
window.addEventListener("hashchange", () => { S.evSel.clear(); render(); document.getElementById("view").scrollTop = 0; });

(async function boot() {
  MODE = await detectMode();
  USERS = await GET("/api/users");
  document.getElementById("identity").innerHTML = USERS.map((u) => `<option value="${esc(u.id)}">${esc(u.name)} · ${pretty(u.role)} · ${esc(u.org_name)}</option>`).join("");
  await signIn("u-analyst");
  ORGS = await GET("/api/orgs");
  setInterval(render, 2000);
})();
})();
</script>
